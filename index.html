lead:`<b>En une ligne :</b> l'employeur choisit librement… dans le respect des priorités d'embauche et de la non-discrimination ; une fois le choix fait, DPAE avant l'embauche, registre du personnel, VIP et information écrite du salarié.`,
sections:[
{t:"Le CDI temps plein, contrat de droit commun",h:`
<p>La forme normale du contrat de travail est le <b>CDI à temps plein</b>. Par exception, on peut conclure un <b>CDD</b> (terme précis ou fin de l'objet), sous conditions.</p>
<p><b>Filières de recrutement :</b> directe (affichage, presse, internet : pas de mention fausse, discriminatoire ou en langue étrangère) ou indirecte : <b>France Travail</b> (accueil, orientation, formation, insertion, placement, indemnisation), <b>Maisons de l'emploi</b> (observation et anticipation, coordination, sensibilisation aux discriminations), <b>Missions locales</b> (jeunes de 16 à 25 ans), cabinets.</p>`},
{t:"Les limites à la liberté de choisir",h:`
<p><b>Priorités d'embauche :</b> temps partiel vers temps plein ; CDD avec 6 mois d'ancienneté (informé des postes en CDI) ; télétravailleur vers poste sur site ; travailleur de nuit vers le jour ; salarié nouvellement qualifié ; licencié économique ; travailleur handicapé.</p>
<p><b>Discriminations interdites</b> : origine, sexe, mœurs, orientation ou identité sexuelle, âge, situation de famille ou grossesse, situation économique, ethnie-nation-race, opinions politiques, activités syndicales, religion, apparence physique, nom, lieu de résidence, santé, handicap.</p>
<p><b>Différences admises</b> (liste limitative) : exigence professionnelle objective et nécessaire, âge, handicap, vulnérabilité économique, situation géographique.</p>
<p><b>Sanctions :</b> civiles (<b>nullité</b> + dommages-intérêts) et pénales (<b>3 ans, 45 000 €</b>).</p>
<p><b>Égalité femmes-hommes :</b> ni sexe ni situation de famille dans l'offre ; pas de refus d'embauche fondé sur le sexe, la famille ou la grossesse.</p>
<p><b>Offre d'emploi :</b> en français, sans mention discriminatoire ni fausse (existence, nature, rémunération, lieu), <b>sans limite d'âge maximale</b> (sauf condition légale ou but légitime proportionné). <b>Réforme 2025 :</b> une <b>fourchette de rémunération</b> doit y figurer.</p>`},
{t:"Questionnaire, test, promesse",h:`
<ul><li><b>Questionnaire :</b> seulement pour apprécier la capacité à occuper l'emploi ; <b>lien direct et nécessaire</b> avec le poste. Le candidat répond de bonne foi ; il est informé à l'avance des méthodes utilisées ; résultats confidentiels ; méthodes pertinentes ; aucune collecte par un dispositif caché.</li>
<li><b>Test professionnel :</b> épreuve courte avant le contrat, hors conditions normales d'emploi, <b>non rémunérée</b> (sauf convention).</li>
<li><b>Promesse d'embauche :</b> engagement ferme et précis mentionnant au minimum l'<b>emploi</b> et la <b>date d'entrée</b> (rémunération et lieu facultatifs). Rétractation = <b>licenciement sans cause réelle et sérieuse</b>. Sans ces mentions : simple offre qui n'engage pas. Pas d'écrit obligatoire, mais utile pour la preuve.</li></ul>`},
{t:"Les formalités d'embauche",h:`
<table><tr><th>Formalité</th><th>À retenir</th></tr>
<tr><td>DPAE</td><td>À l'URSSAF, <b>au plus tôt 8 jours avant</b> l'embauche et avant la prise de poste. Oubli = <b>travail dissimulé</b> + pénalité de <b>1 056 €</b> par salarié. Récépissé sous 5 jours ; copie au salarié (ou contrat écrit mentionnant l'organisme). Intégrée au TESE, CEA, TESA</td></tr>
<tr><td>Registre unique du personnel</td><td>Dès le <b>1er salarié</b>, dans l'ordre des embauches : identité, emploi, qualification, dates, type de contrat, titre de travail des étrangers ; stagiaires dans une partie à part</td></tr>
<tr><td>VIP</td><td>Visite d'information et de prévention par un <b>professionnel de santé</b> (pas forcément le médecin du travail), avant la fin de l'essai et au plus tard <b>3 mois</b> après l'embauche. Attestation de suivi, ou avis d'aptitude si médecin. Puis visite tous les <b>5 ans</b> ou après un arrêt. Toutes entreprises</td></tr></table>
<p><b>Information écrite du salarié :</b></p>
<table><tr><th>Au plus tard le 7e jour</th><th>Au plus tard 1 mois après</th></tr>
<tr><td>Identité des parties, lieu de travail, poste et catégorie, date d'embauche, fin du CDD, période d'essai, rémunération (dont majorations HS) et périodicité, durée du travail, conditions des heures sup ou complémentaires</td><td>Entreprise utilisatrice (intérim), droit à la formation, congés payés, procédure de rupture, conventions applicables, régimes obligatoires, prévoyance et frais de santé</td></tr></table>
<p>Aussi : livret d'épargne salariale, notice de prévoyance, liste des risques professionnels, entretien professionnel.</p>`},
{t:"Conditions de validité du contrat",h:`
<ul><li><b>Fond</b> (droit commun) : consentement libre et éclairé (pas d'erreur, dol, violence ; dol actif ou passif) ; capacité (moins de 16 ans : le représentant légal conclut ; à 16 ans, son autorisation suffit) ; contenu licite et certain.</li>
<li><b>Forme :</b> contrat <b>consensuel</b> (l'oral suffit) pour le CDI temps plein. <b>Écrit obligatoire</b> pour tout autre contrat (CDD, temps partiel…).</li></ul>
<p><b>CDI :</b> pas de clause obligatoire, mais des éléments essentiels (parties, poste, date d'effet, rémunération).</p>
<p><b>CDD, mentions obligatoires :</b> <b>motif</b> précis (remplacement, accroissement d'activité, saisonnier) ; dates, renouvellement, durée minimale si pas de terme précis, essai ; durée hebdomadaire si temps partiel ; poste, et nom et qualification du remplacé ; rémunération (pas moins qu'un CDI équivalent) et composition ; convention collective, caisse de retraite complémentaire, prévoyance.</p>`}
],
exam:["<b>Contrôler la sélection</b> : question licite ? discrimination ? priorité d'embauche ?","<b>Qualifier l'engagement</b> : promesse (emploi + date) ou simple offre.","<b>Vérifier les formalités</b> (DPAE, registre, VIP, écrit si CDD)."]},

"2b":{t:"Clauses du contrat",s:"Essai, mobilité, non-concurrence…",
lead:`<b>En une ligne :</b> une clause facultative, une fois signée, s'impose ; mais chacune a ses conditions de validité, à vérifier une par une.`,
sections:[
{t:"La période d'essai",h:`
<p>Permet à l'employeur d'évaluer le salarié et au salarié de juger le poste. <b>Ne se présume pas</b> : elle doit être prévue au contrat ou dans la convention à laquelle il renvoie.</p>
<table><tr><th>CDI</th><th>Durée max</th><th>Renouvellement compris</th></tr>
<tr><td>Ouvriers, employés</td><td>2 mois</td><td>4 mois</td></tr>
<tr><td>Agents de maîtrise, techniciens</td><td>3 mois</td><td>6 mois</td></tr>
<tr><td>Cadres</td><td>4 mois</td><td>8 mois</td></tr></table>
<p>Renouvellement <b>une fois</b>, seulement si un <b>accord de branche étendu</b> le prévoit. <b>CDD :</b> 1 jour par semaine, 2 semaines max (CDD ≤ 6 mois) ; 1 mois (CDD &gt; 6 mois) ; sans terme précis, calculée sur la durée minimale. Décompte <b>calendaire</b>.</p>
<p><b>Rupture libre</b>, sans motif ni procédure, sauf convention, faute (procédure disciplinaire) ou salarié protégé (autorisation).</p>
<table><tr><th>Délai de prévenance de l'employeur</th><th></th></tr>
<tr><td>Moins de 8 jours de présence</td><td>24 h</td></tr><tr><td>8 jours à 1 mois</td><td>48 h</td></tr><tr><td>Après 1 mois</td><td>2 semaines</td></tr><tr><td>Après 3 mois</td><td>1 mois</td></tr></table>
<p>Le délai ne prolonge pas l'essai ; non respecté : <b>indemnité compensatrice</b> (sauf faute grave). Salarié : <b>48 h</b> (24 h sous 8 jours).</p>`},
{t:"Mobilité et exclusivité",h:`
<p><b>Clause de mobilité :</b> le salarié accepte à l'avance un changement de lieu de travail. Validité : <b>zone géographique précise</b> ; dans l'entreprise seulement (pas le groupe). Mise en œuvre : <b>besoin objectif</b> de l'entreprise et <b>délai de prévenance raisonnable</b>. C'est un changement des conditions de travail, pas du contrat.</p>
<p>Refus légitime si la mutation modifie un <b>élément essentiel</b> (salaire, passage jour/nuit), si le délai est trop court, ou si elle porte une atteinte excessive à la <b>vie personnelle et familiale</b>.</p>
<p><b>Clause d'exclusivité :</b> pendant le contrat, ne travailler que pour l'employeur. Validité : écrite, <b>justifiée</b> par le poste et l'intérêt de l'entreprise, <b>temps plein</b> seulement. Violation : licenciement possible.</p>`},
{t:"La clause d'objectifs",h:`
<p>Objectifs quantitatifs ou qualitatifs dont dépend tout ou partie de la rémunération. Validité :</p>
<ul><li>objectifs <b>réalistes et réalisables</b> (moyens, délai, qualification, conjoncture) ;</li>
<li>critères <b>indépendants de la seule volonté de l'employeur</b> ;</li>
<li>connus et acceptés (ou communiqués en début d'exercice si unilatéraux) ;</li>
<li>pas de rémunération sous le SMIC ou les minima ; calcul vérifiable ; <b>en français</b>.</li></ul>
<div class="trap">L'insuffisance de résultats ne suffit pas, à elle seule, à justifier un licenciement : le juge vérifie que les objectifs étaient réalistes.</div>`},
{t:"Dédit-formation",h:`
<p>Le salarié rembourse les frais de formation s'il <b>démissionne</b> avant un délai (souvent 2 à 5 ans). Elle ne doit pas priver du droit de démissionner :</p>
<ul><li>formation financée <b>par l'employeur seul</b>, au-delà des obligations légales ;</li>
<li>clause écrite <b>avant</b> la formation, précisant montant et durée ;</li>
<li>remboursement <b>proportionné</b> aux frais réels.</li></ul>
<p>Ne joue que si la rupture vient du <b>salarié</b>, jamais en cas de licenciement, même pour faute grave.</p>`},
{t:"Non-concurrence",h:`
<p>Après le contrat, ne pas concurrencer l'employeur. <b>Conditions cumulatives :</b></p>
<ol><li>écrite (contrat ou convention) ;</li>
<li><b>indispensable</b> à la protection des intérêts légitimes de l'entreprise ;</li>
<li><b>limitée dans le temps et dans l'espace</b> ;</li>
<li>tenant compte de l'activité du salarié ;</li>
<li><b>contrepartie financière</b> non dérisoire (souvent 1/4 à 1/2 du salaire mensuel), versée <b>après</b> la rupture.</li></ol>
<p>S'applique à la fin effective du contrat (fin du préavis, ou départ si dispense). Contrepartie due même après faute grave ou démission.</p>
<p><b>Renonciation :</b> selon le contrat ou la convention, sinon avec l'accord du salarié ; <b>claire, non équivoque, en LRAR</b>.</p>
<p><b>Violation par le salarié :</b> restitution de la contrepartie, dommages-intérêts, responsabilité du nouvel employeur complice. <b>Contrepartie non versée :</b> le salarié est libéré, dommages-intérêts possibles.</p>`},
{t:"Clauses interdites",h:`
<ul><li>Clause attributive de juridiction ;</li><li>Clause compromissoire (arbitrage) ;</li><li>Atteinte injustifiée aux libertés ;</li><li><b>Indexation</b> du salaire (inflation, SMIC) ;</li><li>Report du risque économique sur le salarié.</li></ul>`}
],
exam:["<b>Lister les conditions</b> de validité de la clause en cause.","<b>Les confronter aux faits</b> une par une.","<b>Conclure</b> : clause valable et opposable, ou nulle (et ses effets)."]},

"2c":{t:"Temps de travail",s:"Durées, heures sup, astreinte",
lead:`<b>En une ligne :</b> 35 h par semaine, 10 h par jour, 48 h par semaine au plus ; au-delà de 35 h, des heures sup majorées 25 % puis 50 % ; à temps partiel, des heures complémentaires plafonnées.`,
sections:[
{t:"Les durées",h:`
<table><tr><th>Règle</th><th>Seuil</th></tr>
<tr><td>Durée légale</td><td><b>35 h</b> par semaine civile (<b>1 607 h</b>/an), toutes entreprises</td></tr>
<tr><td>Maximum quotidien</td><td><b>10 h</b> (dérogations : surcroît temporaire)</td></tr>
<tr><td>Maximum hebdomadaire absolu</td><td><b>48 h</b> (jusqu'à 60 h avec l'accord de l'inspection)</td></tr>
<tr><td>Maximum moyen</td><td><b>44 h</b> sur 12 semaines (46 h par convention, plus avec l'inspection)</td></tr>
<tr><td>Pause</td><td><b>20 min</b> consécutives dès <b>6 h</b> de travail</td></tr></table>
<p>Au-delà de la durée légale ou conventionnelle : heures supplémentaires ; en dessous : temps partiel.</p>`},
{t:"Le temps de travail effectif",h:`
<p>Le temps où le salarié est <b>à la disposition</b> de l'employeur, se conforme à ses <b>directives</b>, <b>sans pouvoir vaquer</b> librement à ses occupations.</p>
<table><tr><th>Temps</th><th>Travail effectif ?</th></tr>
<tr><td>Pause, repas</td><td>Non, sauf si les 3 critères sont réunis</td></tr>
<tr><td>Habillage</td><td>Non, mais contrepartie (repos ou argent) si tenue imposée <b>et</b> habillage sur place</td></tr>
<tr><td>Déplacement professionnel</td><td>Non, mais contrepartie s'il dépasse le trajet habituel ; pas de perte de salaire sur l'horaire de travail</td></tr>
<tr><td>Astreinte</td><td>Seule l'<b>intervention</b> est du travail effectif</td></tr></table>
<p><b>Astreinte :</b> le salarié, hors du lieu de travail et pas à disposition permanente, doit pouvoir intervenir (il suffit d'être joignable). Mise en place par accord, à défaut par l'employeur après avis du CSE et information de l'inspection. Programme communiqué <b>15 jours</b> avant (1 jour franc si exceptionnel). Contrepartie financière ou en repos.</p>`},
{t:"Les heures supplémentaires",h:`
<p>Au-delà de 35 h, décomptées <b>par semaine</b>. Dues si demandées par l'employeur <b>ou</b> faites avec son accord implicite.</p>
<table><tr><th>Majoration</th><th>Taux</th></tr>
<tr><td>Par accord</td><td>Au moins <b>10 %</b></td></tr>
<tr><td>À défaut, 36e à 43e heure</td><td><b>25 %</b></td></tr>
<tr><td>À défaut, dès la 44e heure</td><td><b>50 %</b></td></tr></table>
<p><b>Contingent :</b> fixé par accord, à défaut <b>220 h</b>/an/salarié (les HS entièrement compensées en repos n'y comptent pas).</p>
<p><b>Repos compensateur équivalent</b> (par accord) : remplace tout ou partie du paiement. <b>Contrepartie obligatoire en repos</b> au-delà du contingent : <b>50 %</b> des heures (20 salariés au plus), <b>100 %</b> (plus de 20).</p>`},
{t:"Les heures complémentaires",h:`
<p>Heures du <b>temps partiel</b> au-delà de la durée du contrat, sans atteindre 35 h.</p>
<ul><li>Plafond : <b>10 %</b> de la durée contractuelle ; jusqu'à <b>1/3</b> par accord. Prévenance de <b>3 jours</b>.</li>
<li>Majoration : <b>10 %</b> dans la limite du dixième ; <b>25 %</b> au-delà (10 % possible par accord de branche).</li>
<li><b>Jamais remplacées par du repos.</b></li>
<li>Si, pendant 12 semaines consécutives (ou 12 sur 15), l'horaire réel dépasse l'horaire prévu d'au moins <b>2 h</b>/semaine, le contrat est modifié (préavis de 7 jours, sauf opposition) : nouvel horaire = horaire prévu + écart moyen.</li></ul>`}
],
exam:["<b>Qualifier le temps</b> (effectif ou non).","<b>Compter</b> les heures au-delà de 35 h et appliquer 25 %, 50 % ou le taux conventionnel.","<b>Contrôler les plafonds</b> (10 h, 48 h, 44 h, contingent)."]},

"2d":{t:"Repos et congés",s:"Repos, jours fériés, congés payés",
lead:`<b>En une ligne :</b> 11 h de repos par jour, 35 h par semaine, le 1er mai chômé et payé, 2,5 jours ouvrables de congés par mois (30 par an).`,
sections:[
{t:"Repos quotidien et hebdomadaire",h:`
<p><b>Quotidien :</b> <b>11 h</b> consécutives entre deux journées (plus pour les moins de 18 ans). Dérogations par accord jusqu'à <b>9 h</b> minimum (éloignement domicile-travail, gardiennage, continuité du service, transport, travail fractionné).</p>
<p><b>Hebdomadaire :</b> <b>24 h</b> + 11 h = <b>35 h</b> consécutives, en principe le <b>dimanche</b>.</p>
<p><b>Dérogations au repos dominical :</b> de plein droit, besoins du public ou de la production, fondement géographique, par branche. Commerces de détail : jusqu'à <b>12 dimanches</b> par an. Pas de majoration automatique du dimanche (seulement dans certains cas légaux).</p>
<p><b>Travaux urgents</b> (sauvetage, accident imminent, réparation) : repos suspendu, avec repos compensateur égal.</p>`},
{t:"Les jours fériés",h:`
<p><b>11 jours fériés :</b> 1er janvier, lundi de Pâques, 1er mai, 8 mai, Ascension, lundi de Pentecôte (en principe journée de solidarité), 14 juillet, Assomption, Toussaint, 11 novembre, Noël.</p>
<table><tr><th></th><th>1er mai</th><th>Autres jours fériés</th></tr>
<tr><td>Chômé ?</td><td><b>Obligatoirement</b> (sauf activités ne pouvant s'interrompre)</td><td>Seulement si accord ou usage</td></tr>
<tr><td>Si chômé</td><td>Payé</td><td>Payé si <b>3 mois</b> d'ancienneté (mensualisé) ; intérimaire sans condition</td></tr>
<tr><td>Si travaillé</td><td><b>Salaire doublé</b></td><td>Salaire normal, sans majoration légale</td></tr></table>
<p>Pas de récupération des heures d'un férié chômé ; pas de jour en plus si le férié tombe un jour non travaillé (sauf convention).</p>`},
{t:"Acquérir des congés payés",h:`
<p><b>2,5 jours ouvrables par mois</b> de travail effectif, temps plein ou partiel : <b>30 jours ouvrables</b> (5 semaines) par an. Équivalences : 4 semaines ou 24 jours de travail = 2,5 jours. Période de référence : <b>1er juin – 31 mai</b> (sauf accord). Arrondi à l'entier supérieur.</p>
<table><tr><th>Absences comptées</th><th>Non comptées</th></tr>
<tr><td>Congés payés, repos compensateurs, RTT, maternité, paternité, adoption, événements familiaux, <b>arrêt maladie ou accident</b> (1 an ininterrompu max), formation, congés économique, social et syndical</td><td>Grève, congé parental à temps plein, présence parentale, solidarité familiale, <b>mise à pied</b></td></tr></table>
<p><b>Maladie non professionnelle :</b> droits limités à <b>2 jours ouvrables par mois</b> (24 par an).</p>`},
{t:"Prendre ses congés",h:`
<ul><li>Période de prise incluant obligatoirement le <b>1er mai – 31 octobre</b> ; fixée par accord, à défaut par l'employeur après avis du CSE ; communiquée <b>2 mois</b> avant.</li>
<li>Congés possibles dès l'embauche. Dates modifiables par l'employeur avec <b>1 mois</b> de préavis (sauf circonstances exceptionnelles).</li>
<li>Pas plus de <b>24 jours ouvrables consécutifs</b> (sauf contraintes géographiques, personne handicapée ou âgée au foyer).</li>
<li>Au moins <b>12 jours ouvrables continus</b> entre le 1er mai et le 31 octobre.</li></ul>
<p><b>Fractionnement</b> (à défaut d'accord) : jours pris hors période sur le congé principal → <b>1 jour</b> en plus pour 3 à 5 jours, <b>2 jours</b> pour 6 jours et plus. La <b>5e semaine</b> n'ouvre pas ce droit.</p>
<p><b>Report :</b> seulement d'un commun accord (ou accord, usage). Sinon jours perdus, sauf s'ils n'ont pu être pris à cause de l'employeur (indemnisés). Empêché par la <b>maladie</b> : report, ou indemnité compensatrice si le contrat est rompu.</p>
<div class="tip">Jurisprudence (Cass. soc. 6 avril 2022) : un salarié dont la demande d'absence n'a pas été expressément refusée a pu la croire acceptée ; pas de faute.</div>`}
],
exam:["<b>Calculer les droits</b> (2,5 jours par mois, absences assimilées).","<b>Vérifier la prise</b> (période, 12 jours continus, 24 jours max).","<b>Appliquer</b> fractionnement, report ou indemnité."]},

"2e":{t:"Rémunération",s:"Salaire, primes, bulletin, protection",
lead:`<b>En une ligne :</b> le salaire se fixe librement au-dessus du SMIC et des minima, dans l'égalité ; il ne se modifie pas sans accord ; il se paie chaque mois avec un bulletin aux mentions encadrées.`,
sections:[
{t:"Fixer le salaire",h:`
<p>Fixation libre par négociation, dans le respect : du <b>SMIC</b> et des minima conventionnels (contravention de 5e classe), de l'<b>égalité femmes-hommes</b>, du principe « <b>à travail égal, salaire égal</b> », du paiement des heures sup et complémentaires.</p>
<p>Écarts admis s'ils reposent sur des <b>éléments objectifs</b> (expérience, diplômes, marché).</p>
<p>En cours de contrat : <b>pas de modification sans accord</b> ; le refus n'est pas une faute, mais peut conduire à un licenciement si la baisse a une cause réelle et sérieuse (difficultés économiques, sanction). <b>Indexation sur le SMIC interdite.</b></p>`},
{t:"Les composantes",h:`
<table><tr><th>Élément</th><th>À retenir</th></tr>
<tr><td>Salaire de base</td><td>Au temps, au rendement, ou fixe + variable ; SMIC garanti</td></tr>
<tr><td>Primes et gratifications</td><td><b>Obligatoires</b> si prévues par contrat, accord, usage ou engagement unilatéral ; alors élément du salaire (13e mois, ancienneté, assiduité, pénibilité, astreinte…). Bonus discrétionnaire : pas un salaire</td></tr>
<tr><td>Avantages en nature</td><td>Salaire non payé en argent : repas, véhicule, logement</td></tr>
<tr><td>Pourboires</td><td>Remis librement par le client ; appartiennent au personnel (reversés intégralement, registre) ; ne compensent pas un salaire sous le SMIC. Exonérés de cotisations et d'IR si salaire ≤ <b>1,6 SMIC</b> (jusqu'au 31/12/2028), mais déclarés en DSN. ≠ « service compris » = salaire ordinaire</td></tr>
<tr><td>Frais professionnels</td><td>Hors assiette si l'employeur prouve leur caractère pro. <b>Au réel</b> (justificatifs) ou <b>forfait</b> (limites URSSAF). Repas sur place 7,50 €, au restaurant 21,40 €, télétravail 2,70 €/jour, mobilités durables 600 €/an (900 € avec abonnement transport), barème kilométrique (+20 % électrique). DFS pour certaines professions</td></tr></table>
<p>Intégrer un élément au salaire sert à : vérifier le SMIC, calculer congés payés, préavis, indemnité de licenciement, cotisations et impôt.</p>`},
{t:"Payer le salaire",h:`
<ul><li><b>Une fois par mois</b> (acompte possible ; ne vise pas les primes), à date régulière.</li>
<li>Virement, chèque barré, ou <b>espèces</b> si moins de <b>1 500 €</b> et à la demande du salarié.</li>
<li>Non-paiement ou retard : contravention de 3e classe (<b>450 €</b>), action au CPH sous <b>3 ans</b>, rupture possible aux torts de l'employeur (effets d'un licenciement sans cause).</li></ul>`},
{t:"Le bulletin de paie",h:`
<p>Remis au paiement (main propre, poste ou électronique) ; pas de signature exigée. Salarié : conservation <b>sans limite</b>. Employeur : double <b>5 ans</b> ; version électronique disponible <b>50 ans</b> ou jusqu'aux 75 ans. Contestation sous <b>3 ans</b>, même après acceptation.</p>
<p><b>Mentions obligatoires</b> (principales) : employeur, SIRET, code APE/NAF, convention collective, salarié, emploi et classification, heures normales et sup avec taux, brut, cotisations (assiette, taux) regroupées en 5 rubriques, exonérations, coût total employeur, net avant impôt et prélèvement à la source, date de paiement, congés, mention de conservation sans limite.</p>
<p><b>Interdit :</b> mentionner la <b>grève</b> ou l'activité de <b>représentant du personnel</b> (fiche annexe pour les heures de délégation).</p>
<p><b>Brut − cotisations salariales (CSG, CRDS, retraite, chômage…) = net.</b></p>`},
{t:"Protéger le salaire",h:`
<p><b>Contre les créanciers de l'employeur</b> (sauvegarde, redressement, liquidation) : l'<b>AGS</b> avance les salaires puis se retourne contre l'employeur (subrogation). <b>Privilège général</b> sur les 6 derniers mois ; <b>superprivilège</b> sur les <b>60 derniers jours</b>.</p>
<p><b>Contre les créanciers du salarié :</b> saisie sur salaire autorisée par le juge du TJ (titre exécutoire, échec de la conciliation).</p>
<p><b>Transparence salariale</b> (directive UE 2023/970, transposition attendue) : fourchette dans l'offre, interdiction de demander l'ancien salaire, accès aux niveaux moyens par sexe ; dès 100 salariés, publication des écarts et analyse conjointe si écart injustifié de plus de 5 %.</p>`}
],
exam:["<b>Qualifier l'élément</b> (salaire, prime obligatoire, frais, pourboire).","<b>Vérifier les limites</b> (SMIC, égalité, indexation).","<b>Contrôler le paiement et le bulletin</b>."]},

"2f":{t:"Partage de la valeur",s:"Participation, intéressement, PEE, PPV, PER",
lead:`<b>En une ligne :</b> la participation est obligatoire dès 50 salariés et calculée sur le bénéfice ; l'intéressement est facultatif et lié aux performances ; PEE, PER et prime de partage de la valeur complètent le dispositif.`,
sections:[
{t:"Participation et intéressement",h:`
<table><tr><th></th><th>Participation</th><th>Intéressement</th></tr>
<tr><td>Objet</td><td>Associer aux <b>bénéfices</b> (réserve spéciale de participation)</td><td>Associer aux <b>résultats ou performances</b></td></tr>
<tr><td>Caractère</td><td><b>Obligatoire</b> dès <b>50 salariés</b> (seuil atteint 5 années civiles consécutives) et en cas d'UES</td><td><b>Facultatif</b>, mais alors pour tous (ancienneté max <b>3 mois</b>)</td></tr>
<tr><td>Mise en place</td><td>Convention, accord avec les syndicats, accord au CSE, ou ratification aux <b>2/3</b>. Sans accord dans l'année : <b>régime d'autorité</b> constaté par l'inspecteur</td><td>Accord d'entreprise (accord-type ou de branche possible), <b>1 à 5 ans</b>, clauses obligatoires</td></tr>
<tr><td>Disponibilité</td><td>Versement immédiat sur demande sous <b>15 jours</b> ; sinon bloquée <b>5 ans</b> (8 sans accord)</td><td>Versement immédiat sur demande sous 15 jours ; sinon placée sur le PEE (5 ans) ou le PER</td></tr></table>
<p><b>Formule légale :</b> <b>RSP = 1/2 × (B − 5 % C) × S/VA</b> (B : bénéfice fiscal après impôt ; C : capitaux propres ; S : salaires ; VA : valeur ajoutée). Un accord peut prévoir autre chose s'il est au moins aussi avantageux (ex. 1/3 du bénéfice fiscal).</p>
<p><b>Répartition :</b> uniforme, proportionnelle au salaire ou au temps de présence, ou mixte ; à défaut, au salaire (plafonné à <b>3 PASS</b> depuis la loi Pacte). Plafond individuel : <b>75 % du PASS</b>.</p>
<p>Versement au plus tard le <b>dernier jour du 5e mois</b> après la clôture, sinon intérêts de retard.</p>
<p><b>Contrôle</b> (les deux) : dépôt ; forme par la <b>DDETS</b> (1 mois) ; fond par l'<b>URSSAF</b> (<b>3 mois</b> pour demander des modifications, sinon avantages sociaux et fiscaux acquis).</p>
<p><b>Information :</b> livret d'épargne salariale, fiche distincte du bulletin à chaque versement, état récapitulatif au départ ; rapport annuel au CSE (participation).</p>`},
{t:"Déblocage anticipé",h:`
<p>Mariage ou PACS, naissance ou adoption d'un <b>3e enfant</b>, divorce avec garde, violences conjugales, invalidité, décès, <b>rupture du contrat</b>, achat ou agrandissement de la résidence principale, surendettement, création ou reprise d'entreprise, parts de SCOP, rénovation énergétique, proche aidant, véhicule propre.</p>
<p>Demande dans les <b>6 mois</b> de l'événement, ou à tout moment pour rupture, décès, invalidité, violences, surendettement, proche aidant.</p>`},
{t:"PEE et PPV",h:`
<p><b>PEE</b> (ou PEG au niveau du groupe, PEI interentreprises) : portefeuille de valeurs mobilières avec l'aide de l'entreprise. Ouvert à tous (ancienneté max 3 mois), conservé après la rupture. Alimenté par l'intéressement, la participation, les transferts, le CET, des <b>versements volontaires</b> (max <b>25 %</b> de la rémunération brute annuelle ; minimum annuel de 160 € au plus) et l'<b>abondement</b> de l'employeur (max <b>3 fois</b> le versement du salarié et 3 290,88 € ; 5 923,58 € en actions de l'entreprise). Bloqué <b>5 ans</b>, mêmes cas de déblocage.</p>
<p><b>Prime de partage de la valeur</b> (loi 2022, pérennisée en 2023) : facultative, par décision unilatérale (après avis du CSE) ou accord ; jusqu'à 4 versements par an. Plafond <b>3 000 €</b>, <b>6 000 €</b> avec intéressement ou participation ; exonérée de cotisations. Moins de 50 salariés et salaire &lt; 3 SMIC : aussi exonérée de CSG-CRDS et d'IR (jusqu'au 31/12/2026). Modulable selon rémunération, classification, ancienneté, présence, durée du travail.</p>`},
{t:"Le PER",h:`
<p>Le PER a remplacé le Perco (loi Pacte, 1er octobre 2020). 3 formes :</p>
<table><tr><th>PER</th><th>À retenir</th></tr>
<tr><td>Individuel</td><td>Ouvert à tous ; versements volontaires, épargne salariale ; sortie en capital ou rente</td></tr>
<tr><td>D'entreprise obligatoire</td><td>Catégorie objective de salariés, adhésion obligatoire ; mis en place par décision, ratification ou accord ; versements obligatoires liquidés en <b>rente viagère</b></td></tr>
<tr><td>D'entreprise collectif (PERECO)</td><td>Tous les salariés (ancienneté max 3 mois), adhésion facultative ou automatique (refus sous 15 jours) ; négociation préalable s'il y a DS ou CSE</td></tr></table>
<p>Bloqué <b>jusqu'à la retraite</b>. Déblocage anticipé : invalidité, décès du conjoint, fin des droits au chômage, surendettement, liquidation judiciaire, <b>achat de la résidence principale</b>. Jours de repos non pris : jusqu'à 10 par an sans CET.</p>`}
],
exam:["<b>Vérifier l'obligation</b> (participation dès 50 salariés sur 5 ans).","<b>Calculer</b> la RSP avec la formule légale si besoin.","<b>Traiter la disponibilité</b> : délai de blocage et cas de déblocage."]},

"2g":{t:"Formation professionnelle",s:"Plan, CPF, PTP, VAE, entretien",
lead:`<b>En une ligne :</b> l'employeur doit adapter ses salariés à leur poste (plan de développement des compétences) ; le salarié dispose de droits propres (CPF, PTP, VAE) ; un entretien de parcours fait le point tous les 4 ans.`,
sections:[
{t:"Les obligations de l'employeur",h:`
<p>Actions concernées : formation, bilan de compétences, VAE, apprentissage.</p>
<ul><li><b>Adapter</b> les salariés à leur poste et maintenir leur employabilité (aussi en cas de reclassement) ;</li>
<li>Former le jeune en alternance ; respecter les formations prévues par accord ou par le contrat ;</li>
<li><b>Financer</b> : contribution annuelle gérée par <b>France compétences</b> (alternance, CPF, petites entreprises, demandeurs d'emploi).</li></ul>`},
{t:"Le plan de développement des compétences",h:`
<p>Ensemble des formations décidées par l'employeur, sous sa <b>responsabilité</b>, après consultation des représentants du personnel ; toutes tailles d'entreprise.</p>
<ul><li>Départ = <b>exécution normale du contrat</b> : refuser est une <b>faute</b> (sauf cas particuliers). Salaire et protection maintenus ; accident = <b>accident du travail</b> ; frais à la charge de l'employeur.</li>
<li>En principe pendant le temps de travail. Hors temps de travail : accord écrit du salarié, max <b>30 h/an</b> (ou 2 % du forfait jours) ; refus ou dénonciation sous 8 jours : pas une faute.</li>
<li>À l'issue : retour au poste ou équivalent ; pas d'obligation de reconnaître la qualification (sauf engagement). Démission libre, sous réserve d'un dédit-formation.</li></ul>`},
{t:"CPF et PTP",h:`
<table><tr><th></th><th>CPF</th><th>PTP (ex-CIF)</th></tr>
<tr><td>Objet</td><td>Compte en euros, mobilisé par la personne</td><td>Formation certifiante pour <b>changer de métier</b>, avec congé</td></tr>
<tr><td>Droits</td><td><b>500 €/an</b>, plafond <b>5 000 €</b> (temps partiel ≥ 50 % : idem) ; non qualifiés : <b>800 €</b>, plafond <b>8 000 €</b></td><td><b>2 ans</b> d'activité dont <b>1 an</b> dans l'entreprise (ou 2 ans sur 5 dont 4 mois de CDD sur 12)</td></tr>
<tr><td>Demande</td><td>Sur le temps de travail : <b>60 jours</b> avant (formation &lt; 6 mois) ou <b>120 jours</b> (≥ 6 mois). Réponse sous <b>30 jours</b>, silence = <b>accord</b>. Hors temps de travail : pas d'accord nécessaire</td><td>Mêmes délais 120/60 jours, réponse sous 30 jours. <b>Pas de refus</b> si conditions remplies ; report de <b>9 mois</b> max (service, absences simultanées)</td></tr>
<tr><td>Coût</td><td>Reste à charge de <b>150 €</b> depuis le 2 avril 2026 (sauf demandeurs d'emploi, abondement employeur…)</td><td>Financé par la commission paritaire (Transitions Pro) ; rémunération en % du salaire de référence</td></tr></table>
<p>Refuser d'utiliser son CPF n'est pas une faute. <b>Délai de carence du PTP :</b> 10 fois la durée du précédent (entre 6 mois et 6 ans).</p>`},
{t:"VAE et entretien de parcours",h:`
<p><b>VAE</b> (France VAE depuis 2022) : obtenir un diplôme ou titre grâce à l'expérience. Sans prévenir l'employeur : hors temps de travail. Sinon <b>congé VAE de 48 h</b> rémunéré : demande <b>30 jours</b> avant, réponse sous <b>15 jours</b> (silence = accord), report d'1 mois max.</p>
<p><b>Entretien de parcours professionnel</b> (tous les salariés, alternants compris) : compétences, parcours, besoins de formation, souhaits d'évolution, CPF.</p>
<ul><li>Dans la <b>1re année</b> suivant l'embauche, puis <b>tous les 4 ans</b> (périodicité modulable, jamais au-delà de 4 ans) ;</li>
<li>Proposé au retour de maternité, congé parental, adoption, proche aidant, sabbatique, mobilité volontaire, arrêt de plus de 6 mois, mandat syndical ;</li>
<li>État des lieux tous les <b>8 ans</b> : au moins une formation, une certification, une progression salariale ou professionnelle.</li></ul>
<p><b>Sanction (50 salariés et +) :</b> sans entretiens ni formation non obligatoire sur 8 ans, abondement du CPF de <b>3 000 €</b>.</p>`}
],
exam:["<b>Identifier qui prend l'initiative</b> (employeur : plan ; salarié : CPF, PTP, VAE).","<b>Vérifier délais et conditions</b> (60/120 jours, ancienneté).","<b>Dire si l'employeur peut refuser</b> et les conséquences."]},

"2h":{t:"Pouvoirs de l'employeur",s:"Règlement intérieur, discipline, contrôle",
lead:`<b>En une ligne :</b> l'employeur dirige, édicte le règlement intérieur, sanctionne et contrôle, mais toujours de façon justifiée et proportionnée, dans le respect des libertés et selon une procédure.`,
sections:[
{t:"Les obligations réciproques",h:`
<table><tr><th>Salarié</th><th>Employeur</th></tr>
<tr><td>Exécuter personnellement le travail ; professionnalisme ; discipline ; loyauté et discrétion</td><td>Fournir le travail et les moyens ; rémunérer ; respecter la réglementation ; sécurité et santé ; libertés fondamentales ; cotisations</td></tr></table>
<p>Du pouvoir de direction découlent un pouvoir <b>normatif</b>, <b>disciplinaire</b> et de <b>contrôle</b>.</p>`},
{t:"Le règlement intérieur",h:`
<p>Obligatoire dès <b>50 salariés</b>. Contenu <b>exclusif</b> : santé-sécurité, participation au rétablissement des conditions de sécurité, <b>discipline</b> (nature et échelle des sanctions). Doit rappeler : droits de la défense, harcèlement et agissements sexistes, protection des lanceurs d'alerte. Peut prévoir une <b>neutralité</b> justifiée et proportionnée. En français.</p>
<p>S'impose à tous les salariés et stagiaires ; aux intérimaires et intervenants extérieurs pour l'hygiène, la sécurité et la discipline générale (pas l'échelle des sanctions).</p>
<p><b>Interdit :</b> clauses contraires à la loi ou aux accords, restrictions injustifiées des libertés, discriminations.</p>
<p><b>Procédure :</b> avis des IRP ; entrée en vigueur au moins <b>1 mois</b> après dépôt et publicité. Les notes de service générales et permanentes sont des <b>adjonctions</b>. Urgence santé-sécurité : application immédiate, communiquée au CSE et à l'inspection.</p>
<p><b>Contrôle :</b> l'<b>inspecteur</b> peut exiger à tout moment retrait ou modification (recours sous 2 mois) ; le <b>CPH</b> écarte la clause et annule la sanction, sans annuler la clause ; le <b>TJ</b> peut annuler la clause illégale.</p>`},
{t:"Les sanctions",h:`
<p>Sanction = toute mesure, <b>autre qu'une observation verbale</b>, prise après un agissement jugé fautif, qui affecte présence, fonction, carrière ou rémunération.</p>
<table><tr><th>Sanction</th><th>Procédure ?</th><th>Accord du salarié ?</th></tr>
<tr><td>Avertissement / blâme</td><td>Non (écrit motivé)</td><td>Non</td></tr>
<tr><td>Mise à pied disciplinaire</td><td>Oui</td><td>Non</td></tr>
<tr><td>Mutation disciplinaire</td><td>Oui</td><td><b>Oui</b></td></tr>
<tr><td>Rétrogradation</td><td>Oui</td><td><b>Oui</b> (baisse de salaire)</td></tr>
<tr><td>Licenciement pour faute</td><td>Oui</td><td>Non</td></tr></table>
<p>Elles doivent être prévues par le RI. <b>Amendes et sanctions pécuniaires interdites</b>.</p>
<div class="trap">Mise à pied <b>conservatoire</b> (mesure d'attente) ≠ mise à pied <b>disciplinaire</b> (sanction).</div>
<p><b>Retenue sur salaire :</b> licite si elle n'excède pas le <b>temps non travaillé</b> (absence, droit de retrait injustifié, prime d'assiduité). Exclure des salariés d'une augmentation générale pour comportement = sanction pécuniaire interdite.</p>`},
{t:"La procédure disciplinaire",h:`
<ol><li><b>Convocation</b> précisant l'objet (sauf avertissement), délai raisonnable ; <b>5 jours ouvrables</b> s'il s'agit d'un licenciement.</li>
<li><b>Entretien</b> : assistance par un membre du personnel ; l'employeur expose le motif et écoute.</li>
<li><b>Notification</b> motivée, entre <b>2 jours ouvrables</b> et <b>1 mois</b> après l'entretien (LRAR).</li></ol>
<p>Sanction qui modifie le contrat : accord du salarié ; en cas de refus, l'employeur peut licencier.</p>
<p><b>Prescription :</b> poursuites dans les <b>2 mois</b> de la connaissance des faits (sauf poursuites pénales). Sanction de plus de <b>3 ans</b> : plus invocable.</p>
<p><b>Contrôle du CPH :</b> faute inexistante → annulation, pas de nouvelle sanction ; <b>disproportion</b> → annulation, nouvelle sanction plus faible possible sans procédure ; irrégularité → annulation non obligatoire.</p>`},
{t:"Contrôler l'activité",h:`
<p>Tout contrôle doit être <b>justifié</b> par la tâche et <b>proportionné</b>. Information collective et <b>consultation du CSE</b> ; respect de la loi Informatique et libertés et du RGPD ; information individuelle (finalités, base légale, destinataires, durée, droits, CNIL) ; DPO associé ; registre des traitements.</p>
<table><tr><th>Dispositif</th><th>Règle</th></tr>
<tr><td>Vidéosurveillance</td><td>Contrôle l'activité, pas exclusivement le salarié</td></tr>
<tr><td>Écoutes</td><td>Interdites, sauf démarche qualité ou formation</td></tr>
<tr><td>Ordinateur, mails</td><td>Présumés professionnels ; fichiers identifiés comme personnels : contrôle avec l'accord du salarié</td></tr>
<tr><td>Géolocalisation</td><td>Sécurité, allocation des tâches, facturation, ou temps de travail s'il n'y a pas d'autre moyen</td></tr></table>`},
{t:"Libertés et harcèlement",h:`
<p>Pas de restriction aux libertés qui ne soit <b>justifiée</b> par la tâche et <b>proportionnée</b> : vie privée, égalité, expression, liberté syndicale, dignité, religion.</p>
<table><tr><th></th><th>Harcèlement moral</th><th>Harcèlement sexuel</th></tr>
<tr><td>Définition</td><td>Agissements <b>répétés</b> dégradant les conditions de travail (droits, dignité, santé, avenir)</td><td>Propos ou comportements sexuels <b>répétés</b> dégradants ou créant une situation hostile ; ou <b>pression grave, même unique</b>, pour obtenir un acte sexuel</td></tr>
<tr><td>Protection</td><td colspan="2">Victimes et témoins ne peuvent être sanctionnés ou discriminés ; rupture = <b>nulle</b>. L'employeur doit prévenir (et pour le sexuel, faire cesser et sanctionner ; textes affichés)</td></tr></table>
<p><b>Médiation</b> possible (harcèlement moral). <b>Preuve aménagée :</b> la victime présente des éléments laissant supposer le harcèlement ; l'employeur prouve qu'il n'y en a pas. Les syndicats peuvent agir avec l'accord écrit du salarié.</p>
<p>Atteinte au médiateur, ou discrimination après harcèlement : <b>1 an et 3 750 €</b>.</p>`}
],
exam:["<b>Vérifier la base</b> : sanction prévue au RI ? contrôle justifié et proportionné ?","<b>Dérouler la procédure</b> (5 jours, 2 jours, 1 mois, prescription de 2 mois).","<b>Dire ce que fera le juge</b> (annulation, nouvelle sanction possible ?)."]}
});

"2i":{t:"Santé et sécurité",s:"Acteurs, obligations, responsabilités",
lead:`<b>En une ligne :</b> l'employeur doit éviter, évaluer et combattre les risques (DUERP) ; le salarié doit prendre soin de sa sécurité et peut se retirer d'un danger grave et imminent ; un manquement engage la responsabilité civile (faute inexcusable) et pénale.`,
sections:[
{t:"Les acteurs",h:`
<table><tr><th>Acteur</th><th>Rôle</th></tr>
<tr><td>CSE</td><td>Consulté sur santé, sécurité, conditions de travail ; droit d'alerte</td></tr>
<tr><td>CSSCT</td><td>Commission du CSE dès <b>300 salariés</b> (ou sites à risque) ; prépare les délibérations, <b>sans pouvoir de décision</b></td></tr>
<tr><td>Service de santé au travail</td><td>Interne ou interentreprises : suivi de la santé, conseil en prévention</td></tr>
<tr><td>Médecin du travail</td><td>Mission <b>exclusive</b> : éviter l'altération de la santé du fait du travail. Visites, avis d'aptitude ou d'inaptitude. Secret médical, indépendance</td></tr>
<tr><td>CPAM</td><td>Instruit les AT-MP, verse les prestations, prévention et tarification</td></tr></table>`},
{t:"Les obligations de l'employeur",h:`
<p>Locaux sûrs, propres et sains (aération, éclairage, température, électricité, incendie, évacuation). Mesures : <b>prévention</b>, <b>information-formation</b>, <b>organisation et moyens</b> adaptés, mises à jour.</p>
<p><b>9 principes de prévention :</b> 1. éviter les risques ; 2. évaluer ceux qu'on ne peut éviter ; 3. les combattre à la source ; 4. adapter le travail à l'homme ; 5. tenir compte de la technique ; 6. remplacer le dangereux ; 7. planifier la prévention (dont harcèlement) ; 8. <b>protection collective avant individuelle</b> ; 9. donner des instructions.</p>
<p><b>DUERP</b> (document unique) : inventaire des risques par unité de travail, mis à jour au moins <b>une fois par an</b>, en tenant compte du sexe ; suivi d'actions de prévention.</p>
<p><b>Pénibilité</b> : contraintes physiques (charges, postures, vibrations), environnement agressif (chimique, hyperbare, températures, bruit), rythmes (nuit, équipes alternantes, travail répétitif). Le <b>C2P</b> donne des points pour : une formation vers un poste moins exposé, un temps partiel sans perte de salaire, un départ anticipé à la retraite.</p>`},
{t:"Droits et devoirs du salarié",h:`
<p>Chaque salarié prend soin de sa santé et de celle des autres, selon sa formation et les instructions reçues.</p>
<p><b>Droit de retrait :</b> s'il a un <b>motif raisonnable</b> de penser qu'une situation présente un <b>danger grave et imminent</b> pour sa vie ou sa santé, il alerte et se retire. Ni sanction ni retenue de salaire ; l'employeur ne peut exiger la reprise tant que le danger persiste.</p>
<p><b>Alerte santé publique et environnement :</b> le salarié de bonne foi alerte, l'alerte est consignée par écrit, l'employeur informe des suites ; protection de <b>lanceur d'alerte</b>.</p>`},
{t:"Les responsabilités de l'employeur",h:`
<p>Il ne garantit pas l'absence de tout risque, mais doit les <b>éviter au maximum</b> et les évaluer. Sa responsabilité peut être recherchée <b>avant même tout dommage</b> ou après un AT-MP. Depuis <b>2016</b>, plus d'obligation de résultat stricte pour les risques psychosociaux : il s'exonère s'il prouve avoir pris des mesures de prévention (Cass. soc. 1er juin 2016) ou réagi rapidement ; il manque à son obligation s'il n'agit pas après avoir été informé (2018).</p>
<p><b>Civile, faute inexcusable :</b> il avait ou aurait dû avoir conscience du danger et n'a pas pris les mesures. Faute déterminante (pas forcément exclusive). Indemnisation des préjudices non couverts et majoration de rente. <b>Présomption</b> si le risque lui avait été signalé (salarié ou IRP) ou en cas de défaut de formation-information.</p>
<p><b>Pénale :</b> amende (3 750 € minimum) et prison jusqu'à 10 ans.</p>
<p><b>Délégation de pouvoirs :</b> transfère la responsabilité au délégataire si celui-ci a la <b>compétence, l'autorité et les moyens</b> ; délégation <b>exclusive</b> (subdélégation possible), <b>nécessaire</b>, <b>antérieure</b> au dommage, sans participation du chef d'entreprise au fait fautif.</p>`}
],
exam:["<b>Identifier le risque</b> et l'obligation de l'employeur (DUERP, prévention).","<b>Vérifier</b> si le droit de retrait est fondé (motif raisonnable, danger grave et imminent).","<b>Qualifier la responsabilité</b> (faute inexcusable, pénale, délégation)."]},

"2j":{t:"Modifier la relation de travail",s:"Contrat ou conditions de travail",
lead:`<b>En une ligne :</b> modifier un élément essentiel du contrat exige l'accord du salarié ; changer ses conditions de travail relève du pouvoir de direction, et le refus est fautif.`,
sections:[
{t:"Élément essentiel ou non ?",h:`
<table><tr><th></th><th>Élément essentiel (contrat)</th><th>Conditions de travail</th></tr>
<tr><td>Exemples</td><td>Rémunération, durée du travail, qualification, lieu (hors secteur), tout élément contractualisé</td><td>Organisation, tâches de même qualification, changement d'horaires dans la journée, lieu dans le même secteur</td></tr>
<tr><td>Qui décide ?</td><td><b>Accord du salarié</b> nécessaire</td><td>L'employeur, seul (pouvoir de direction)</td></tr>
<tr><td>Refus du salarié</td><td>Pas une faute ; l'employeur renonce ou licencie (si cause réelle et sérieuse)</td><td><b>Faute</b> pouvant justifier une sanction</td></tr></table>
<p><b>Motif économique :</b> proposition en <b>LRAR</b> ; le salarié a <b>1 mois</b> pour refuser (<b>15 jours</b> en redressement ou liquidation). Silence = <b>acceptation</b>. Sans motif économique, pas de procédure légale particulière.</p>`},
{t:"Mobilité volontaire sécurisée",h:`
<p>Entreprises ou groupes d'au moins <b>300 salariés</b>, <b>24 mois</b> d'ancienneté : le salarié va travailler dans une autre entreprise, son contrat est <b>suspendu</b>, avec l'accord de l'employeur. Après <b>2 refus</b>, accès de droit au congé de formation (CPF).</p>
<p>Avenant : objet, durée, dates, délai pour annoncer qu'il ne revient pas, retour anticipé. Au retour : même emploi ou similaire, qualification et salaire au moins équivalents, entretien professionnel. S'il ne revient pas : <b>démission</b> sans autre préavis que celui de l'avenant. Liste des demandes au CSE tous les 6 mois.</p>`},
{t:"L'accord de performance collective",h:`
<p>Accord collectif pour répondre aux nécessités de fonctionnement ou préserver/développer l'emploi, <b>même sans difficultés économiques</b>. Il peut aménager la <b>durée du travail</b>, la <b>rémunération</b> (dans le respect des salaires minima hiérarchiques) et la <b>mobilité</b> interne.</p>
<p>Préambule avec ses objectifs ; peut prévoir les efforts des dirigeants et actionnaires, la conciliation vie pro-vie perso, l'accompagnement et l'abondement du CPF.</p>
<p>Ses clauses <b>se substituent de plein droit</b> aux clauses contraires du contrat. Le salarié peut <b>refuser par écrit dans le mois</b> ; l'employeur a <b>2 mois</b> pour le licencier, pour un <b>motif spécifique</b> qui vaut cause réelle et sérieuse. Le salarié est ensuite indemnisé au chômage.</p>
<p><b>Télétravail :</b> exemple de modification des conditions de travail (accord collectif, charte après avis du CSE, ou simple accord individuel).</p>`}
],
exam:["<b>Qualifier</b> : élément essentiel ou simple condition de travail ?","<b>En déduire</b> si l'accord du salarié est nécessaire.","<b>Tirer les conséquences</b> du refus (faute ou licenciement possible)."]},

"2k":{t:"Ruptures communes à tous les contrats",s:"Essai, résiliation, prise d'acte, faute, inaptitude",
lead:`<b>En une ligne :</b> plusieurs modes de rupture valent pour CDI comme CDD ; le juge requalifie souvent : résiliation et prise d'acte justifiées = licenciement sans cause réelle et sérieuse.`,
sections:[
{t:"Rupture de la période d'essai",h:`
<p>Libre, sans motif, mais l'employeur doit pouvoir montrer des raisons <b>professionnelles</b> : sinon rupture <b>abusive</b> (discrimination, motif économique). Procédure seulement si convention, faute ou salarié protégé.</p>
<p>Prévenance : employeur 24 h / 48 h / 2 semaines / 1 mois ; salarié 24 h / 48 h. Non respectée : indemnité compensatrice (sauf faute grave), sans prolonger l'essai.</p>`},
{t:"Résiliation judiciaire et prise d'acte",h:`
<table><tr><th></th><th>Résiliation judiciaire</th><th>Prise d'acte</th></tr>
<tr><td>Principe</td><td>Le salarié <b>demande au CPH</b> de rompre le contrat pour manquements graves de l'employeur ; il continue à travailler</td><td>Le salarié <b>rompt lui-même</b> le contrat immédiatement (sans préavis), puis saisit le juge</td></tr>
<tr><td>Qui ?</td><td>Le salarié seulement (l'employeur : seulement pour faute grave d'un apprenti)</td><td>Tout salarié, sauf pendant l'essai</td></tr>
<tr><td>Effet si justifiée</td><td colspan="2">Licenciement <b>sans cause réelle et sérieuse</b> (ou <b>nul</b> pour un protégé) : indemnités de licenciement, de préavis, de congés, pour licenciement injustifié + certificat et attestation</td></tr>
<tr><td>Effet sinon</td><td>Le contrat continue, rien n'est dû</td><td><b>Démission</b> : le salarié doit l'indemnité de préavis (et le dédit-formation)</td></tr>
<tr><td>Date</td><td>Celle du jugement</td><td>Immédiate</td></tr></table>
<p>Exemples de manquements : discrimination, harcèlement, non-paiement du salaire, modification du contrat imposée. Prise d'acte : bureau de jugement directement, dans le mois.</p>`},
{t:"Faute grave ou lourde",h:`
<table><tr><th></th><th>Faute grave</th><th>Faute lourde</th></tr>
<tr><td>Définition</td><td>Rend <b>impossible le maintien</b> du salarié ; départ immédiat ; peut être une première faute</td><td>Commise avec l'<b>intention de nuire</b> à l'employeur (à prouver par lui)</td></tr>
<tr><td>Exemples</td><td>Selon les circonstances</td><td>Concurrence déloyale, violences ou séquestration pendant une grève</td></tr></table>
<p>Pas de préavis ni d'indemnité de préavis.</p>`},
{t:"Inaptitude",h:`
<p>Incapacité physique, constatée par le <b>médecin du travail</b>, d'exercer tout ou partie de ses fonctions.</p>
<p><b>Obligation de reclassement</b> dans l'entreprise ou le groupe, selon les indications du médecin, même en cas d'inaptitude à tout emploi ; proposition précise et réelle. Sinon : licenciement <b>sans cause réelle et sérieuse</b>. Refus du salarié : nouvelle proposition ou licenciement pour impossibilité de reclassement.</p>
<table><tr><th></th><th>CDI</th><th>CDD</th></tr>
<tr><td>Rupture</td><td>Licenciement</td><td>Rupture anticipée possible si reclassement impossible</td></tr>
<tr><td>Indemnités</td><td>Légales ou conventionnelles ; <b>origine professionnelle</b> : indemnité spéciale = <b>double</b> de l'indemnité légale, sans condition d'ancienneté + indemnité compensatrice de préavis</td><td>Au moins l'indemnité légale de licenciement (double si professionnelle), au prorata si moins d'un an + indemnité de précarité</td></tr></table>`},
{t:"Force majeure",h:`
<p>Événement <b>extérieur</b> à la volonté des parties, <b>imprévisible</b> à la conclusion, <b>irrésistible</b> : rupture immédiate sans procédure.</p>
<table><tr><th>CDI</th><th>CDD</th></tr>
<tr><td>Indemnité de licenciement, compensatrice de congés et de préavis</td><td>Compensatrice de congés + indemnité égale aux salaires jusqu'au terme ; <b>pas de prime de précarité</b></td></tr></table>`}
],
exam:["<b>Qualifier le mode de rupture</b> choisi par les faits.","<b>Vérifier ses conditions</b> (gravité, intention de nuire, reclassement, 3 critères de force majeure).","<b>Lister les indemnités</b> dues."]},

"2l":{t:"Rompre un CDI",s:"Rupture conventionnelle, démission, licenciement personnel",
lead:`<b>En une ligne :</b> la rupture conventionnelle est le seul départ amiable (homologué par la DREETS) ; la démission doit être claire ; le licenciement personnel exige une cause réelle et sérieuse et une procédure stricte.`,
sections:[
{t:"La rupture conventionnelle individuelle",h:`
<p>Seul mode de rupture <b>amiable</b> du CDI ; aucune partie ne peut l'imposer. Indemnité spécifique + droit au <b>chômage</b>.</p>
<ol><li><b>Un ou plusieurs entretiens</b> librement organisés. Salarié assisté par un salarié de l'entreprise ou, sans IRP, un conseiller du salarié ; alors l'employeur peut aussi être assisté (moins de 50 : syndicat patronal ou autre employeur).</li>
<li><b>Convention</b> : date de rupture (au plus tôt le lendemain de l'homologation) et indemnité. Un exemplaire au salarié, sinon <b>nullité</b> (effets d'un licenciement sans cause).</li>
<li><b>Rétractation : 15 jours calendaires</b> dès le lendemain de la signature.</li>
<li><b>Homologation</b> par la <b>DREETS</b> en <b>15 jours</b> ; silence = homologation. Refus motivé.</li></ol>
<p>Recours au CPH dans les <b>12 mois</b> de l'homologation. <b>Salarié protégé :</b> autorisation de l'inspecteur (15 jours), recours sous 2 mois.</p>
<p><b>Rupture conventionnelle collective :</b> à l'initiative de l'<b>employeur</b> seul, <b>sans difficultés économiques</b>, par accord collectif (nombre de départs, suppressions, durée, critères) ; DREETS informée, CSE consulté ; validation en <b>15 jours</b> (silence = accord). Indemnités au moins légales + chômage. Contentieux devant le <b>juge administratif</b> (2 mois pour agir).</p>`},
{t:"La démission",h:`
<p>Rupture unilatérale du salarié, volonté <b>claire et non équivoque</b> (une absence ne suffit pas). Aucune procédure légale.</p>
<p><b>Présomption de démission</b> pour <b>abandon de poste</b> : le salarié mis en demeure (LRAR ou main propre) de justifier son absence et de reprendre ne revient pas dans le délai fixé. Contestation : bureau de jugement directement, décision en 1 mois.</p>
<p>Démission <b>abusive</b> (intention de nuire) : dommages-intérêts. Indemnités : compensatrice de préavis si l'employeur l'en dispense, de congés payés ; déblocage de l'épargne salariale.</p>`},
{t:"La cause réelle et sérieuse",h:`
<p>Motif <b>disciplinaire</b> (faute) ou <b>non disciplinaire</b> (insuffisance professionnelle, inaptitude). Cause : <b>réelle</b> (existe), <b>précise et vérifiable</b>, <b>sérieuse</b> (assez importante).</p>
<p><b>Motifs interdits :</b> avoir subi, refusé ou dénoncé un harcèlement ; témoigné de corruption ; grève licite ; droit d'expression ; opinions et activités syndicales ; exercice d'un droit (inspecteur, CPH) ; sanction de plus de 3 ans ; discrimination ; vie privée ; santé ou handicap (sauf inaptitude) ; grossesse.</p>
<p><b>Exceptions :</b> fait de vie privée créant un <b>trouble caractérisé</b> dans l'entreprise ou violant la loyauté ou la probité. <b>Maladie :</b> pas un motif, mais des absences qui perturbent l'entreprise et imposent un <b>remplacement définitif en CDI</b> (pas CDD, intérim, stage ni temps de travail différent) peuvent l'être.</p>`},
{t:"La procédure",h:`
<ol><li><b>Convocation</b> (LRAR, main propre ou moyen daté) : objet, date, heure, lieu, assistance (personnel ou conseiller du salarié), adresse de la mairie ou de l'inspection.</li>
<li><b>Entretien</b> au moins <b>5 jours ouvrables</b> après la présentation de la lettre. L'absence du salarié ne bloque pas la procédure.</li>
<li><b>Lettre de licenciement</b> en LRAR, au moins <b>2 jours ouvrables</b> après l'entretien ; au plus <b>1 mois</b> si disciplinaire. Elle énonce <b>chaque motif</b>.</li></ol>
<p>Précisions des motifs : sur demande du salarié dans les <b>15 jours</b> (réponse sous 15 jours), ou à l'initiative de l'employeur dans les 15 jours. Motivation insuffisante seule : indemnité d'<b>1 mois</b> max.</p>`},
{t:"Les indemnités",h:`
<ul><li><b>Indemnité légale</b> (dès <b>8 mois</b> d'ancienneté) : <b>1/4 de mois</b> par année jusqu'à 10 ans, <b>1/3</b> au-delà ; ancienneté à la fin du préavis ; mois complets au prorata.</li>
<li><b>Compensatrice de préavis</b> : si l'employeur dispense le salarié ; pas en cas de faute grave ou lourde, de dispense demandée par le salarié, ou d'incapacité (sauf si imputable à l'employeur, ex. AT). Maladie non professionnelle : préavis non prolongé ; AT-MP : prolongé.</li>
<li><b>Compensatrice de congés payés</b> : toujours due, même pendant l'essai.</li></ul>`},
{t:"Nul, injustifié ou irrégulier",h:`
<table><tr><th></th><th>Nul</th><th>Sans cause réelle et sérieuse</th><th>Irrégulier</th></tr>
<tr><td>Cas</td><td>Liberté fondamentale, maternité, discrimination, harcèlement, action en égalité ou dénonciation, grève, salarié protégé, juré…</td><td>Motif invalidé par le juge</td><td>Procédure non respectée, cause réelle et sérieuse</td></tr>
<tr><td>Réintégration</td><td><b>De droit</b> si demandée, avec les salaires perdus</td><td>Proposée par le juge si 2 ans d'ancienneté, 11 salariés et +, et pas d'opposition</td><td>Non</td></tr>
<tr><td>Sinon</td><td>Indemnités de rupture + au moins <b>6 mois</b> de salaire (non plafonnée)</td><td>Indemnité entre un minimum et un maximum selon l'effectif et l'ancienneté</td><td><b>1 mois</b> de salaire max</td></tr></table>`}
],
exam:["<b>Identifier le mode</b> (RC, démission, licenciement) et ses conditions.","<b>Contrôler la cause et la procédure</b> (5 jours, 2 jours, motifs).","<b>Qualifier la sanction</b> (nul, injustifié, irrégulier) et chiffrer les indemnités."]},

"2m":{t:"Licenciement économique",s:"Motif, reclassement, PSE, procédure",
lead:`<b>En une ligne :</b> un motif non inhérent à la personne (difficultés, mutations technologiques, compétitivité, cessation), apprécié au niveau du secteur du groupe en France, après échec du reclassement, avec une procédure qui dépend du nombre de licenciements.`,
sections:[
{t:"Le motif économique",h:`
<p>Motif <b>non inhérent à la personne</b>, entraînant une <b>suppression ou transformation d'emploi</b> ou une <b>modification refusée</b> d'un élément essentiel, consécutive notamment à :</p>
<ol><li>des <b>difficultés économiques</b> ;</li><li>des <b>mutations technologiques</b> ;</li><li>une <b>réorganisation</b> nécessaire à la sauvegarde de la compétitivité ;</li><li>la <b>cessation d'activité</b>.</li></ol>
<p><b>Difficultés :</b> évolution significative d'un indicateur (commandes, CA, pertes, trésorerie, EBE). Baisse des commandes ou du CA, par rapport à la même période de l'année précédente, pendant au moins :</p>
<table><tr><th>Effectif</th><th>Durée</th></tr><tr><td>Moins de 11</td><td>1 trimestre</td></tr><tr><td>11 à 49</td><td>2 trimestres consécutifs</td></tr><tr><td>50 à 299</td><td>3 trimestres consécutifs</td></tr><tr><td>300 et +</td><td>4 trimestres consécutifs</td></tr></table>
<p><b>Périmètre :</b> l'entreprise si elle est indépendante ; sinon le <b>secteur d'activité commun</b> aux entreprises du groupe <b>en France</b> (produits, clientèle, réseaux de distribution).</p>`},
{t:"Éviter le licenciement",h:`
<p>Licenciement possible seulement après tous les efforts de <b>formation, d'adaptation et de reclassement</b> sur les emplois disponibles en France, dans l'entreprise et le groupe (là où la permutation est possible).</p>
<table><tr><th>Outil</th><th>À retenir</th></tr>
<tr><td>Activité partielle</td><td>Réduction ou suspension temporaire d'activité ; indemnité au salarié, prise en charge partielle par l'État ; <b>6 mois</b> renouvelables</td></tr>
<tr><td>APDE / accord de performance collective</td><td>Sans attendre des difficultés graves ; s'impose au contrat ; sans baisser la rémunération mensuelle moyenne des 3 derniers mois ; réponse sous <b>1 mois</b> (silence = acceptation) ; refus = motif de licenciement ; 5 ans par défaut</td></tr>
<tr><td>Accord de maintien de l'emploi</td><td><b>Graves difficultés conjoncturelles</b> ; syndicats majoritaires ; maintien de l'emploi contre baisse de salaire (pas sous <b>1,2 SMIC</b>) ou aménagement du temps de travail ; <b>5 ans</b> max ; refus écrit sous 1 mois → licenciement économique possible ; pas de licenciement économique pendant l'accord</td></tr></table>`},
{t:"Procédure selon le nombre",h:`
<p>Consultation préalable du <b>CSE</b> et information de la <b>DREETS</b> pour tout licenciement collectif.</p>
<table><tr><th>Licenciements sur 30 jours</th><th>Entretien préalable</th><th>Envoi de la lettre</th></tr>
<tr><td>Moins de 10</td><td>Oui, pour chacun</td><td>Au moins <b>7 jours ouvrables</b> après l'entretien (<b>15</b> pour un cadre licencié individuellement)</td></tr>
<tr><td>10 à 49</td><td>Non (sauf absence de CSE)</td><td>Au moins <b>30 jours</b> après la notification du projet à la DREETS</td></tr>
<tr><td>50 et +</td><td>Non (sauf absence de CSE)</td><td>Après validation ou homologation du PSE (ou fin des délais de contrôle)</td></tr></table>
<p><b>Lettre :</b> motifs économiques, <b>CSP</b> (moins de 1 000 salariés) ou <b>congé de reclassement</b> (1 000 et +), <b>priorité de réembauche</b> d'un an. Contestation sous <b>12 mois</b>. Préavis classique. Salarié protégé : avis des IRP + autorisation de l'inspecteur (15 jours).</p>
<p><b>Priorité de réembauche :</b> <b>1 an</b> après la rupture, à demander dans ce délai ; non respectée : au moins <b>2 mois</b> de salaire (selon le préjudice si moins de 2 ans d'ancienneté et moins de 11 salariés).</p>
<p>Mesures d'accompagnement : PSE, CSP, ASP, congé de reclassement, de mobilité, de conversion, cellule de reclassement, allocation temporaire dégressive.</p>`},
{t:"Le PSE",h:`
<p>Obligatoire dès <b>50 salariés</b> pour au moins <b>10 licenciements sur 30 jours</b>. Objectif : éviter ou limiter les licenciements.</p>
<p><b>Mesures obligatoires</b> (plan de reclassement) : reclassement interne en France (catégorie inférieure avec accord exprès), reprise d'activités, activités nouvelles, reclassement externe, soutien à la création par les salariés, formation-VAE-reconversion, réduction du temps de travail et des heures sup, CSP ou congé de reclassement, attention aux salariés âgés ou fragiles. <b>1 000 salariés et +</b> qui ferment un site : recherche d'un <b>repreneur</b>. <b>Facultatives :</b> primes au départ volontaire, congés de conversion, cellule de reclassement.</p>
<p>Établi par <b>accord majoritaire validé</b> par la DREETS, ou par <b>document unilatéral homologué</b> par la DREETS ; salariés informés par affichage ou autre moyen daté.</p>
<p><b>Nullité</b> du licenciement (hors redressement ou liquidation) sans validation ou homologation, en cas de refus, d'annulation pour absence ou insuffisance du PSE, ou sans consultation des IRP : réintégration ou indemnité pour licenciement nul. Annulation pour un autre motif : réintégration si tous sont d'accord, sinon au moins <b>6 mois</b> de salaire.</p>`}
],
exam:["<b>Caractériser le motif</b> (indicateur, durée selon l'effectif, périmètre du secteur du groupe).","<b>Vérifier le reclassement</b> et les mesures préalables.","<b>Dérouler la procédure</b> selon le nombre (moins de 10, 10-49, 50 et +, PSE)."]},

"2n":{t:"Retraite, fin de contrat, chômage",s:"Départ, documents, transaction, ARE",
lead:`<b>En une ligne :</b> le salarié part à la retraite ; l'employeur ne peut la lui imposer qu'à 70 ans ; à toute rupture, il remet certificat, attestation et solde de tout compte ; l'ARE suppose une perte involontaire d'emploi et 6 mois de travail sur 24.`,
sections:[
{t:"Départ et mise à la retraite",h:`
<table><tr><th></th><th>Départ (salarié)</th><th>Mise à la retraite (employeur)</th></tr>
<tr><td>Condition</td><td>Âge légal atteint (62 à <b>64 ans</b> selon l'année de naissance ; 64 ans dès 1968, avec 172 trimestres pour le taux plein)</td><td>Proposition possible à l'âge du taux plein automatique (65-67 ans), <b>3 mois avant chaque anniversaire</b> ; unilatérale dès <b>70 ans</b></td></tr>
<tr><td>Préavis</td><td>1 mois (6 mois à 2 ans d'ancienneté), 2 mois (au-delà)</td><td>Préavis de licenciement</td></tr>
<tr><td>Indemnité</td><td>1/2 mois (10 ans), 1 mois (15 ans), 1,5 mois (20 ans), 2 mois (30 ans)</td><td>Comme l'indemnité de licenciement : 1/4 de mois par an jusqu'à 10 ans, 1/3 ensuite</td></tr></table>
<p>Salaire de référence de la mise à la retraite : moyenne des 12 derniers mois ou 1/3 des 3 derniers, le plus favorable.</p>
<p><b>Retraite progressive :</b> 60 ans, 150 trimestres, temps partiel entre <b>40 et 80 %</b> : fraction de pension + salaire.</p>`},
{t:"Les obligations à la fin du contrat",h:`
<ul><li><b>Certificat de travail</b> (tout contrat, tout motif) : identités, dates, emplois et périodes, portabilité santé et prévoyance, date, lieu, signature. Absence : amende de <b>750 €</b> et dommages-intérêts.</li>
<li><b>Attestation France Travail</b> : nécessaire pour l'ARE.</li>
<li><b>Reçu pour solde de tout compte</b> : inventaire des sommes, en double exemplaire. Signature libre ; le paiement ne peut en dépendre. Signé et non dénoncé dans les <b>6 mois</b> : <b>libératoire</b> pour les sommes mentionnées.</li>
<li><b>Solde :</b> salaire au prorata, primes et 13e mois au prorata, congés non pris, heures sup, RTT, <b>prime de précarité de 10 %</b> (6 % par convention) pour un CDD, indemnités de licenciement, épargne débloquée.</li>
<li><b>DMMO</b> mensuelle dès 50 salariés.</li></ul>
<p><b>Préavis</b> du salarié licencié : moins de 6 mois d'ancienneté selon convention, contrat ou usage ; 6 mois à 2 ans : <b>1 mois</b> ; plus de 2 ans : <b>2 mois</b>. Démission : convention, contrat ou usage. Non exécuté : dispense amiable, force majeure, inaptitude, démission pour grossesse, faute grave ou lourde. Faute grave pendant le préavis travaillé : rupture immédiate (indemnité de licenciement conservée, préavis perdu sauf la part travaillée) ; pendant une dispense : préavis dû en totalité.</p>`},
{t:"La transaction",h:`
<p>Accord pour régler le différend lié à la rupture (Code civil). Conditions : <b>écrite et signée</b>, <b>concessions réciproques</b>, objet certain et licite, consentement, conclue <b>après la rupture définitive</b>. Elle ne doit pas masquer un licenciement abusif (sinon nulle).</p>
<p><b>Homologation</b> par le CPH : force exécutoire ; refus possible si déséquilibrée (somme inférieure à l'indemnité légale). Ensuite plus de contestation, sauf cause de nullité ou inexécution ; le CPH ne peut pas modifier son contenu.</p>`},
{t:"L'allocation de retour à l'emploi",h:`
<p>Gérée par l'<b>UNEDIC</b> (paritaire) hors Sécurité sociale ; cotisations et allocations confiées à <b>France Travail</b>.</p>
<p><b>4 conditions :</b> 1. salarié <b>involontairement privé d'emploi</b>, apte, résidant en France (pas les mandataires sociaux) ; 2. <b>inscrit</b> à France Travail dans les 12 mois ; 3. avoir travaillé <b>130 jours ou 910 h</b> (6 mois) sur <b>24 mois</b> (36 mois dès 55 ans) ; <b>5 mois</b> pour les primo-entrants depuis le 1er avril 2026 ; 4. rupture ouvrant droit.</p>
<table><tr><th>Ouvre droit</th><th>N'ouvre pas droit</th></tr>
<tr><td>Licenciement (tout motif), fin de CDD, rupture conventionnelle, force majeure, rupture d'essai (même par le salarié), résiliation judiciaire, nullité, prise d'acte non abusive, <b>démission légitime</b></td><td>Démission non légitime, départ à la retraite</td></tr></table>
<p><b>Démissions légitimes</b> (liste du décret 2019) : suivre un conjoint muté, mariage ou PACS (2 mois), violences conjugales, enfant handicapé placé loin, mineur suivant ses parents, nouvel emploi rompu dans les 65 jours, <b>non-paiement des salaires</b>, acte délictueux (plainte), création d'entreprise (accompagnée), service civique, clause de conscience du journaliste… Démission pour <b>créer ou reprendre une entreprise</b> : ARE possible sous conditions.</p>
<p><b>Durée :</b> délai d'attente de <b>7 jours</b> ; différé congés payés + différé spécifique (max <b>150 jours</b>, 75 en économique). Indemnisation de 182 jours à <b>548 j</b> (moins de 55 ans), 685 j (55-56), 822 j (57 et +), réduite de 25 % en conjoncture favorable. Droits rechargeables, droit d'option.</p>
<p>Allocation imposable, soumise à CSG-CRDS (réduites si sous le SMIC journalier) ; obligations de recherche active. Contentieux : <b>TJ</b> après recours amiable ; prescription <b>2 ans</b>. Fin de droits : <b>ASS</b> sous conditions. <b>Portabilité</b> de la prévoyance (sauf faute lourde).</p>`}
],
exam:["<b>Identifier qui rompt</b> (départ ou mise à la retraite) et calculer l'indemnité.","<b>Lister les documents et sommes</b> de fin de contrat.","<b>Vérifier l'ARE</b> : rupture involontaire ou démission légitime, 6 mois sur 24."]}
});
