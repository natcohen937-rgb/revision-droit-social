"3a":{t:"Temps partiel et CDD",s:"Recours, durée, carence, précarité",
lead:`<b>En une ligne :</b> un CDD n'est valable que pour une tâche précise et temporaire, dans un cas prévu par la loi, par écrit ; sinon il est requalifié en CDI.`,
sections:[
{t:"Le temps partiel",h:`
<p>Durée inférieure à la durée légale (35 h, ou la durée conventionnelle si elle est plus courte), à <b>151,67 h</b> par mois ou à <b>1 607 h</b> par an.</p>
<p><b>Minimum légal : 24 h par semaine</b>, sauf demande expresse du salarié ou convention collective.</p>
<div class="trap">Un temps partiel de moins de 24 h n'est <b>pas</b> requalifié en temps plein : sanction = rappel de salaire (et dommages-intérêts si préjudice distinct).</div>`},
{t:"Quand peut-on recourir au CDD ?",h:`
<p>Toujours : une <b>tâche précise et temporaire</b> (ou la politique de l'emploi), sans pourvoir durablement un <b>emploi permanent</b>.</p>
<table><tr><th>Cas autorisé</th><th>Particularités</th></tr>
<tr><td>Remplacement d'un absent</td><td>Toute absence <b>sauf grève</b> ; sans terme précis, avec durée minimale ; peut commencer avant l'absence</td></tr>
<tr><td>Départ définitif avant suppression du poste</td><td>Suppression prévue (pas seulement envisagée) sous 24 mois ; consultation du CSE</td></tr>
<tr><td>Attente d'un salarié recruté en CDI</td><td>9 mois max</td></tr>
<tr><td>Remplaçant d'un salarié passé à temps partiel</td><td>Avenant ou écrit avec le remplacé</td></tr>
<tr><td>Accroissement temporaire d'activité</td><td>18 mois (3 mois si licenciement économique dans les 6 mois) ; commande exceptionnelle à l'export (6 à 24 mois) ; tâche ponctuelle ; travaux urgents de sécurité (9 mois)</td></tr>
<tr><td>Saisonnier</td><td>Travaux répétés chaque année à date fixe ; pas de terme précis ; <b>pas d'indemnité de précarité</b></td></tr>
<tr><td>CDD d'usage</td><td>Secteurs listés (hôtellerie-restauration, spectacle, audiovisuel, enseignement, sport pro, déménagement…) ; pas soumis aux 18 mois</td></tr>
<tr><td>CDD à objet défini</td><td>Ingénieurs et cadres, accord de branche étendu (ou d'entreprise) ; <b>18 à 36 mois</b>, non renouvelable ; fin avec l'objet, prévenance de 2 mois</td></tr></table>
<p><b>Interdits :</b> remplacer un <b>gréviste</b> (requalification + sanctions pénales) ; sur le poste d'un licencié économique dans les <b>6 mois</b> (sauf accroissement de 3 mois max ou export, avec consultation des IRP et priorité de réembauche) ; <b>travaux particulièrement dangereux</b> (dérogation DREETS, silence d'un mois = accord).</p>`},
{t:"Durée, renouvellement, forme",h:`
<p>À défaut de branche : <b>18 mois</b> maximum, renouvellements compris, <b>2 renouvellements</b> au plus. <b>9 mois</b> (attente d'un CDI, travaux urgents) ; <b>24 mois</b> (étranger, départ avant suppression du poste, commande exceptionnelle à l'export).</p>
<p><b>Renouvellement :</b> prévu par le contrat ou un avenant, accepté expressément <b>avant le terme</b>.</p>
<p><b>Écrit obligatoire avec le motif précis</b>, sinon <b>CDI</b>. Mentions : poste, nom et qualification du remplacé, terme et renouvellement, durée minimale, convention collective, essai, rémunération, caisses de retraite complémentaire et prévoyance.</p>`},
{t:"Le terme et ses suites",h:`
<ul><li>Fin <b>de plein droit</b> au terme, même si le contrat est suspendu. Remplacement : terme reporté jusqu'au <b>surlendemain</b> du retour du remplacé.</li>
<li>La relation continue après le terme : <b>CDI</b> ; ancienneté conservée ; durée du CDD déduite de l'essai.</li>
<li><b>Proposition de CDI</b> sur le même emploi ou similaire (salaire, durée, classification, lieu) : par écrit avant le terme, délai raisonnable (silence = refus). Refus : l'employeur informe France Travail sous <b>1 mois</b> ; pas d'indemnité de précarité ; effets sur le chômage.</li></ul>`},
{t:"Rompre un CDD avant son terme",h:`
<p>Seulement : <b>accord</b> des parties, <b>faute grave ou lourde</b>, <b>force majeure</b>, <b>embauche en CDI</b> du salarié, <b>inaptitude</b>.</p>
<p>CDI trouvé : préavis d'<b>1 jour par semaine</b> (sur la durée totale si terme précis, sinon sur la durée effectuée), <b>2 semaines max</b>.</p>
<p><b>Rupture fautive :</b> par l'employeur, salaires jusqu'au terme ; par le salarié, dommages-intérêts fixés par le CPH.</p>`},
{t:"Carence et indemnité de fin de contrat",h:`
<p><b>Délai de carence</b> avant un nouveau CDD sur le même poste (à défaut de branche) : <b>1/3</b> de la durée si le CDD a duré 14 jours et plus ; <b>1/2</b> en dessous.</p>
<p><b>Pas de carence :</b> nouvelle absence du remplacé, travaux urgents de sécurité, saisonnier ou d'usage, rupture anticipée par le salarié, refus du renouvellement par le salarié.</p>
<p><b>Indemnité de précarité : 10 %</b> de la rémunération brute totale ; <b>6 %</b> par accord avec contreparties de formation. <b>Pas due :</b> CDD d'usage, saisonnier, vendanges, politique de l'emploi (professionnalisation), embauche en CDI, refus d'un CDI équivalent.</p>`}
],
exam:["<b>Vérifier le motif</b> (cas autorisé, pas d'interdiction).","<b>Contrôler forme et durée</b> (écrit, 18 mois, 2 renouvellements, carence).","<b>Sanction</b> : requalification en CDI, indemnité de précarité."]},

"3b":{t:"Autres contrats",s:"Intérim, portage, alternance, chantier",
lead:`<b>En une ligne :</b> l'intérimaire est salarié de l'agence et travaille pour l'entreprise utilisatrice, avec les mêmes règles que le CDD ; alternance et CDI de chantier ont chacun leur logique.`,
sections:[
{t:"Le contrat de travail temporaire",h:`
<p>Relation à <b>3</b> : l'<b>ETT</b> embauche et paie ; elle met le salarié à disposition de l'<b>entreprise utilisatrice</b>. Deux contrats : <b>mise à disposition</b> (ETT-EU) et <b>contrat de mission</b> (ETT-salarié). Règles proches du CDD (motifs, interdits, 18 mois, carence).</p>
<p><b>Terme précis obligatoire</b> pour : remplacement d'un salarié passé à temps partiel, départ avant suppression du poste, accroissement temporaire. Sinon (absent, attente d'un CDI, saisonnier, usage) : durée minimale.</p>
<p><b>Carence :</b> 1/3 (14 jours et +) ou 1/2 (moins de 14 jours), en <b>jours d'ouverture</b> de l'EU. Ex. : mission de 3 mois → 1 mois ; 10 jours → 5 jours.</p>
<p><b>Essai</b> (à défaut d'accord) : <b>2 jours</b> ouvrés (≤ 1 mois), <b>3</b> (1 à 2 mois), <b>5</b> (plus de 2 mois).</p>
<p><b>Droits :</b> mêmes droits et équipements que les salariés de l'EU ; l'<b>EU</b> répond des conditions de travail (durée, nuit, repos, sécurité) ; salaire au moins égal à un CDI équivalent après essai. Droits collectifs dans l'ETT ; comptés dans l'effectif de l'EU au prorata (sauf remplaçant).</p>
<p><b>Fin de mission :</b> indemnité de fin de mission de <b>10 %</b> au moins + indemnité de congés payés de <b>1/10</b> (indemnité de fin de mission comprise). Proposition de CDI par l'EU : même procédure qu'en CDD.</p>
<p><b>Rupture anticipée par l'ETT :</b> nouvelle mission sous <b>3 jours ouvrables</b>, sans modification essentielle ; sinon salaire jusqu'au terme. La fin de la mise à disposition n'est <b>pas</b> une force majeure. <b>Par le salarié :</b> dommages-intérêts, sauf CDI trouvé (préavis 1 jour par semaine, de 1 jour à 2 semaines). <b>CDI intérimaire</b> possible.</p>`},
{t:"Le portage salarial",h:`
<p>Relation tripartite : le <b>salarié porté</b>, en contrat avec l'<b>entreprise de portage</b>, réalise des prestations pour des <b>clients</b>. Il doit avoir l'expertise, la qualification et l'autonomie pour trouver ses clients ; il négocie le prix et rend compte à la société de portage.</p>
<p>Rémunération minimale fixée par la branche, à défaut <b>2 517,13 €</b> brut par mois ; <b>indemnité d'apport d'affaires de 5 %</b> ; en CDD, indemnité de fin de contrat de 10 %. Périodes sans prestation non payées.</p>`},
{t:"Professionnalisation et apprentissage",h:`
<table><tr><th></th><th>Professionnalisation</th><th>Apprentissage</th></tr>
<tr><td>Public</td><td>16-25 ans ; demandeurs d'emploi de 26 ans et + ; bénéficiaires RSA, ASS, AAH</td><td><b>16 à 29 ans</b> (15 ans possible ; sans limite si handicap ou création d'entreprise)</td></tr>
<tr><td>Objet</td><td>Qualification (RNCP, branche, CQP) ; alternance école-entreprise ; <b>tuteur</b></td><td>Alternance CFA-employeur ; contrat signé après inscription au CFA</td></tr>
<tr><td>Rémunération</td><td>Moins de 21 ans : <b>55 %</b> du SMIC (65 % si bac pro) ; 21-25 ans : <b>70 %</b> (80 %) ; 26 ans et + : <b>85 %</b></td><td></td></tr>
<tr><td>Rupture</td><td></td><td>Libre pendant les <b>45 premiers jours</b> en entreprise (écrit, notifié au CFA). Ensuite : employeur pour force majeure, faute grave, inaptitude (sans reclassement) ; apprenti : <b>médiateur</b> d'abord, information de l'employeur sous 5 jours, rupture au moins 7 jours après</td></tr></table>
<p>Pas d'indemnité de précarité pour les contrats de la politique de l'emploi.</p>`},
{t:"Le CDI de chantier ou d'opération",h:`
<p>CDI conclu pour un chantier ou une opération, rompu quand il est achevé. Possible dans toute branche dotée d'un <b>accord collectif étendu</b> précisant : taille des entreprises, activités, information du salarié, contreparties (salaire, indemnité de licenciement), formation, rupture si le chantier n'a pas lieu ou s'arrête tôt.</p>
<p>La fin du chantier est une <b>cause réelle et sérieuse</b> ; indemnités de licenciement selon l'accord.</p>`}
],
exam:["<b>Choisir le bon contrat</b> pour la situation (CDD, intérim, alternance, chantier).","<b>Vérifier ses conditions</b> (motif, durée, accord de branche).","<b>Tirer les conséquences</b> de la fin ou de la rupture."]},

"3c":{t:"Maladie, accident, inaptitude",s:"Suspension, indemnisation, reclassement",
lead:`<b>En une ligne :</b> la maladie suspend le contrat ; l'origine professionnelle donne une meilleure indemnisation (60 % puis 80 %, sans carence) et une protection renforcée contre le licenciement.`,
sections:[
{t:"La suspension du contrat",h:`
<p>Le contrat est maintenu mais les obligations réciproques (travailler, payer) s'arrêtent : maladie, maternité, paternité, grève, fermeture, congé sabbatique, force majeure. Le salarié reste tenu de <b>loyauté et de confidentialité</b>.</p>`},
{t:"Maladie ou accident non professionnel",h:`
<p><b>IJSS :</b> mêmes conditions que vu en protection sociale (150 h sur 3 mois ou 1 015 × SMIC ; au-delà de 6 mois : 12 mois d'affiliation + 600 h ou 2 030 × SMIC). <b>50 %</b> du salaire journalier de base, après <b>3 jours de carence</b>.</p>
<p><b>Complément employeur</b> : dès <b>1 an d'ancienneté</b>, si l'incapacité est justifiée sous <b>48 h</b>, prise en charge par la Sécurité sociale, soins en France ou dans l'UE/EEE (contre-visite possible).</p>
<p>Autorisations d'absence pour les traitements d'une maladie grave.</p>
<p><b>Visite de reprise :</b> obligatoire après un congé maternité ou une absence de plus de <b>30 jours</b> ; possible à la demande (prévention de l'inaptitude), sans sanction possible.</p>`},
{t:"Accident du travail, trajet, maladie professionnelle",h:`
<p><b>Accident du travail :</b> événement <b>soudain</b>, un <b>préjudice</b>, survenu par le fait ou à l'occasion du travail. <b>Trajet :</b> domicile-travail ou repas-travail, parcours normal sans détour personnel ; employeur informé sous <b>24 h</b>, déclaration à la CPAM sous <b>48 h</b>.</p>
<p><b>Maladie professionnelle :</b> présumée si elle figure dans un <b>tableau</b> et est contractée dans ses conditions ; sinon reconnue si elle est <b>essentiellement et directement</b> causée par le travail habituel.</p>
<p><b>Protection :</b> contrat suspendu pendant l'arrêt (et le stage de réadaptation) ; la durée compte pour l'ancienneté ; priorité de formation. <b>Rupture interdite</b> pendant la suspension, sauf <b>faute grave</b> ou <b>impossibilité de maintenir</b> le contrat pour un motif étranger à l'accident.</p>
<p><b>IJSS :</b> SJR = salaire brut du mois précédent / 30,42 (plafonné). <b>60 %</b> du 1er au 28e jour, <b>80 %</b> ensuite ; jour de l'accident payé par l'employeur ; <b>aucun délai de carence</b>. Jusqu'à guérison, consolidation ou décès ; puis capital (IPP &lt; 10 %) ou rente. <b>Réforme 2027 :</b> IJ plafonnées à 4 ans par période d'incapacité. Immunité civile de l'employeur en principe ; voir faute inexcusable ou intentionnelle (Partie 1).</p>`},
{t:"Apte ou inapte au retour",h:`
<table><tr><th></th><th>Non professionnel</th><th>Professionnel</th></tr>
<tr><td>Apte</td><td>Le contrat reprend</td><td>Même emploi ou similaire, salaire au moins équivalent ; aucun retard de carrière</td></tr>
<tr><td>Inapte</td><td colspan="2"><b>Reclassement</b> dans l'entreprise ou le groupe en France, selon les conclusions écrites du médecin (en professionnel : <b>après avis des représentants du personnel</b>), emploi aussi comparable que possible (mutation, aménagement)</td></tr>
<tr><td>Licenciement</td><td colspan="2">Seulement si impossibilité de reclasser (motifs donnés par écrit), refus du salarié, ou mention expresse du médecin (maintien gravement préjudiciable ou état faisant obstacle à tout reclassement). Procédure de licenciement personnel</td></tr></table>
<p><b>1 mois</b> après l'examen de reprise sans reclassement ni licenciement : l'employeur reprend le <b>paiement du salaire</b>.</p>`}
],
exam:["<b>Qualifier l'origine</b> (professionnelle ou non, trajet).","<b>Indemniser</b> (IJSS, carence, complément employeur).","<b>Gérer le retour</b> : apte, inapte, reclassement, protection contre le licenciement."]},

"3d":{t:"Maternité et paternité",s:"Congés, protection, indemnisation",
lead:`<b>En une ligne :</b> 16 semaines de congé maternité pour un 1er ou 2e enfant ; protection relative avant et après, absolue pendant ; 28 jours de congé de paternité et de naissance.`,
sections:[
{t:"Le congé de maternité",h:`
<table><tr><th>Situation</th><th>Prénatal</th><th>Postnatal</th><th>Total</th></tr>
<tr><td>1 enfant, 0 ou 1 à charge</td><td>6 sem.</td><td>10 sem.</td><td><b>16 sem.</b></td></tr>
<tr><td>1 enfant, 2 et + à charge</td><td>8 sem.</td><td>18 sem.</td><td><b>26 sem.</b></td></tr>
<tr><td>Jumeaux</td><td>12 sem.</td><td>22 sem.</td><td><b>34 sem.</b></td></tr>
<tr><td>Triplés et +</td><td>24 sem.</td><td>22 sem.</td><td><b>46 sem.</b></td></tr></table>
<p>Congé écourté possible, mais au moins <b>8 semaines</b> d'arrêt (dont 6 après l'accouchement) pour être indemnisée.</p>
<p><b>IJ :</b> 6 mois d'immatriculation, arrêt d'au moins 8 semaines, 150 h sur 3 mois ou 1 015 × SMIC sur 6 mois ; salaire journalier = 3 derniers salaires / 91,25, dans la limite du plafond. Frais médicaux de grossesse et d'accouchement remboursés.</p>`},
{t:"Révéler sa grossesse",h:`
<p>Aucune obligation de la révéler à l'<b>embauche</b> (même en CDD) ni pendant le contrat : seulement avant de partir en congé. Mais tant que l'employeur n'est pas informé, pas de protection contre le licenciement, d'absences payées pour examens, ni de réduction du temps de travail.</p>`},
{t:"La protection contre le licenciement",h:`
<table><tr><th>Période</th><th>Protection</th><th>Licenciement possible ?</th></tr>
<tr><td>Grossesse connue, avant le congé</td><td>Relative</td><td>Seulement pour <b>faute grave</b> non liée à la grossesse ou <b>impossibilité</b> de maintenir le contrat pour un motif étranger</td></tr>
<tr><td>Pendant le congé (même non pris en entier)</td><td><b>Absolue</b></td><td><b>Jamais</b> : ni notifié, ni prendre effet</td></tr>
<tr><td>10 semaines après le congé (ou les congés payés accolés)</td><td>Relative</td><td>Faute grave ou impossibilité</td></tr></table>
<p>Licenciement en cours : <b>annulé</b> si la salariée envoie en LRAR un certificat de grossesse dans les <b>15 jours</b> de la notification ; réintégration rapide.</p>`},
{t:"Le congé de paternité et d'accueil de l'enfant",h:`
<p>Père, conjoint, partenaire ou concubin de la mère (ou mère n'ayant pas accouché). <b>28 jours</b> = 3 jours ouvrables de naissance + <b>25</b> jours calendaires (<b>35</b> jours si naissances multiples), dans les <b>6 mois</b>.</p>
<p>Obligatoires et consécutifs : les 3 jours de naissance + les <b>4 premiers jours</b>. Le reste (21 ou 28 jours) en 2 périodes max de 5 jours au moins.</p>
<p>Informer l'employeur de la date prévue <b>1 mois</b> avant, puis 1 mois avant le début du congé. Refus = contravention de <b>1 500 €</b>. Contrat suspendu ; retour au même emploi ou similaire ; IJ (6 mois d'immatriculation, 150 h sur 3 mois).</p>
<p><b>Protection :</b> pas de rupture pendant les <b>10 semaines</b> qui suivent la naissance, sauf faute grave ou impossibilité.</p>
<p><b>Réforme 2026 :</b> nouveau congé de naissance de <b>1 à 2 mois</b> par parent, pour les enfants nés ou adoptés depuis le 1er janvier 2026.</p>`},
{t:"Synthèse de la prise en charge",h:`
<table><tr><th>Risque</th><th>Sécurité sociale</th></tr>
<tr><td>Non professionnel</td><td>IJ de <b>50 %</b> après <b>3 jours de carence</b></td></tr>
<tr><td>Professionnel (AT, trajet, MP)</td><td>Frais intégralement pris en charge ; IJ <b>60 %</b> puis <b>80 %</b>, <b>sans carence</b> ; capital ou rente si incapacité permanente</td></tr></table>
<p>L'<b>employeur</b> complète les IJ (complément légal ou conventionnel), sous conditions d'ancienneté et de justification ; plus favorable et plus rapide en cas d'AT-MP.</p>`}
],
exam:["<b>Situer la période</b> (avant, pendant, après le congé).","<b>En déduire la protection</b> (relative ou absolue).","<b>Calculer la durée</b> du congé et les droits à IJ."]},

"3e":{t:"Aménager le temps de travail",s:"Nuit, modulation, activité partielle, forfaits",
lead:`<b>En une ligne :</b> le travail de nuit est exceptionnel et encadré ; on peut moduler la durée sur plus d'une semaine ; l'activité partielle indemnise 60 % ; les forfaits en jours (218 j max) visent des salariés autonomes.`,
sections:[
{t:"Le travail de nuit",h:`
<p><b>Période de nuit :</b> au moins <b>9 h consécutives</b> incluant <b>minuit-5 h</b>, entre <b>21 h et 7 h</b> (7 h dans la presse, l'audiovisuel, le spectacle, les discothèques ; dans les ZTI, 7 h incluant minuit-7 h si elle commence après 22 h). Autre période autorisable par l'inspecteur.</p>
<p><b>Travailleur de nuit :</b> au moins <b>2 fois par semaine</b>, au moins <b>3 h</b> de nuit (ou durée conventionnelle).</p>
<table><tr><th>Limite</th><th>Seuil</th></tr>
<tr><td>Par nuit</td><td><b>8 h</b> consécutives (dépassement autorisé par l'inspecteur)</td></tr>
<tr><td>Par semaine</td><td><b>40 h</b> en moyenne sur 12 semaines (jusqu'à 44 h par décret)</td></tr>
<tr><td>Repos</td><td><b>11 h</b> après la période travaillée</td></tr></table>
<p><b>Exceptionnel :</b> justifié par la continuité de l'activité ou des services d'utilité sociale, en tenant compte de la santé. Autorisation de l'inspecteur si pas d'accord (négociation engagée) ; contreparties : <b>repos compensateur</b> et, le cas échéant, compensation salariale, pauses.</p>
<p><b>Droits :</b> refus possible pour obligations familiales impérieuses (pas une faute) ; <b>priorité</b> pour un poste de jour (et inversement) ; femme enceinte affectée de jour.</p>`},
{t:"L'aménagement du temps de travail",h:`
<p>Répartir la durée sur une période <b>supérieure à la semaine</b> (haute et basse saison).</p>
<table><tr><th>Par accord collectif</th><th>Par l'employeur</th></tr>
<tr><td>Période de référence fixée par l'accord, <b>jusqu'à 1 an</b> ; <b>3 ans</b> si un accord de branche le permet</td><td>Programme indicatif soumis à l'avis du CSE ; période de <b>4 semaines</b> max (<b>9 semaines</b> sous 50 salariés)</td></tr></table>`},
{t:"L'activité partielle",h:`
<p>Outil de prévention des licenciements : <b>réduction</b> de l'horaire ou <b>fermeture temporaire</b>. Causes : conjoncture, approvisionnement, sinistre ou intempéries exceptionnels, restructuration ou modernisation, autre circonstance exceptionnelle.</p>
<ul><li>Demande à la <b>DDETS</b> dans les <b>30 jours</b> du placement ; dès <b>50 salariés</b>, avis préalable du CSE (motifs, catégories, critères, formation).</li>
<li>Indemnité au salarié : <b>60 %</b> du salaire brut par heure chômée, à la date de paie (mentions sur le bulletin) ; complément possible ; <b>exonérée de cotisations</b> de Sécurité sociale.</li>
<li>Allocation à l'employeur (ASP) demandée dans l'<b>an</b> ; contingent de <b>1 000 h</b> par an et par salarié (<b>100 h</b> pour modernisation).</li>
<li>Heures indemnisables : en deçà de la durée collective, dans la limite de la durée légale. Toutes comptent pour les congés payés.</li></ul>`},
{t:"Les conventions de forfait",h:`
<table><tr><th></th><th>Forfait jours</th><th>Forfait heures</th></tr>
<tr><td>Pour qui</td><td>Cadres <b>autonomes</b> ne suivant pas l'horaire collectif ; salariés à durée non prédéterminée et réellement autonomes</td><td>Semaine ou mois : tout salarié. Année : cadres hors horaire collectif ou salariés autonomes, avec accord collectif</td></tr>
<tr><td>Mise en place</td><td>Accord collectif (à défaut, employeur) + <b>convention individuelle écrite signée</b></td><td><b>Convention individuelle signée</b></td></tr>
<tr><td>Durée</td><td><b>218 jours</b> max ; pas de durées maximales en heures, mais repos quotidien et hebdomadaire, congés, fériés garantis ; suivi de la charge de travail</td><td>Heures sup prévisibles incluses d'avance ; durées maximales respectées ; au-delà du forfait, HS payées normalement</td></tr>
<tr><td>Contreparties</td><td>Jours de repos ; rachat possible par avenant écrit majoré d'au moins <b>10 %</b> ; entretien annuel ; indemnité si salaire sans rapport avec les contraintes</td><td>Rémunération des heures incluses</td></tr></table>`}
],
exam:["<b>Qualifier</b> : travail de nuit, travailleur de nuit, forfait possible ?","<b>Vérifier les conditions</b> (accord, autonomie, signature, autorisation).","<b>Appliquer les limites</b> (8 h, 40 h, 218 jours, 60 %)."]},

"3f":{t:"Conflits collectifs",s:"Grève, lock-out, conciliation, médiation, arbitrage",
lead:`<b>En une ligne :</b> la grève est un arrêt total, concerté, pour des revendications professionnelles ; elle suspend le contrat ; tout le reste est un mouvement illicite. Conciliation, médiation et arbitrage aident à sortir du conflit.`,
sections:[
{t:"La grève licite",h:`
<p>Cessation <b>collective et concertée</b> du travail pour appuyer des <b>revendications professionnelles</b>. Pas seul (sauf grève nationale ou seul salarié), pas besoin d'une majorité.</p>
<div class="tip">3 conditions : <b>arrêt total</b> + <b>concertation</b> (pas besoin d'un syndicat) + <b>revendications professionnelles</b>.</div>
<p><b>Privé :</b> aucun préavis, à tout moment, sans tentative de conciliation ; l'employeur doit connaître les revendications <b>avant</b> le début (tout moyen). <b>Public :</b> préavis de 5 jours. Aucune durée minimale ou maximale ; arrêts courts répétés licites.</p>
<p><b>Illicites :</b> grève <b>perlée</b> (ralentissement), grève limitée à une obligation (astreintes), blocage sans arrêt concerté, grève <b>purement politique</b>. Participants non protégés : sanction, voire licenciement pour faute lourde.</p>
<p><b>Abus :</b> bloquer l'accès, occuper pour empêcher les non-grévistes de travailler, dégrader, violences : sanctions pénales ; syndicats et grévistes responsables.</p>`},
{t:"Les effets de la grève",h:`
<table><tr><th>Pour…</th><th>Effet</th></tr>
<tr><td>Le gréviste</td><td>Contrat <b>suspendu</b>, pas rompu (sauf faute lourde : participation personnelle à des actes illicites). Aucune sanction ni discrimination ; licenciement pour grève = <b>nul</b>. Retenue <b>proportionnelle</b> à l'arrêt ; pas de mention de la grève sur le bulletin. Salaire dû si manquement grave et délibéré de l'employeur ou accord de fin de grève</td></tr>
<tr><td>Le non-gréviste</td><td>L'employeur doit fournir du travail et payer, sauf impossibilité prouvée ; avec piquet ou occupation, il n'est dispensé que s'il a demandé l'expulsion</td></tr>
<tr><td>L'entreprise</td><td><b>Interdit</b> de remplacer les grévistes par des CDD ou intérimaires</td></tr></table>
<p><b>Lock-out :</b> fermeture temporaire par l'employeur. Licite si <b>nécessaire</b> (sécurité non assurée) ; illicite s'il est préventif ou de rétorsion (responsabilité de l'employeur). Il suspend les contrats.</p>`},
{t:"Conciliation, médiation, arbitrage",h:`
<table><tr><th></th><th>Conciliation</th><th>Médiation</th><th>Arbitrage</th></tr>
<tr><td>Qui ?</td><td>Commission nationale ou régionale paritaire (pouvoirs publics ≤ 1/3)</td><td>Médiateur désigné par les parties, sinon par l'inspection sur une liste</td><td>Arbitre choisi d'un commun accord</td></tr>
<tr><td>Déclenchement</td><td>Tout conflit collectif</td><td>Président de la commission, inspection du travail ou ministre</td><td>Prévu par la convention, ou accord des parties après conciliation ou médiation</td></tr>
<tr><td>Résultat</td><td>PV d'accord ou de désaccord ; partie absente : 2e convocation sous 8 jours puis rapport au procureur</td><td><b>Recommandation motivée</b> sous <b>1 mois</b> ; rejet motivé sous <b>8 jours</b> ; échec : rapport au ministre (48 h), publication sous 3 mois</td><td><b>Sentence</b> motivée, en <b>droit</b> (interprétation des textes) ou en <b>équité</b> (salaires, conditions) ; même effet qu'un accord collectif</td></tr>
<tr><td>Recours</td><td></td><td>Si le litige est juridique : renvoi au juge ou à l'arbitrage</td><td>Seulement devant la <b>Cour supérieure d'arbitrage</b> (excès de pouvoir, violation de la loi)</td></tr></table>`}
],
exam:["<b>Vérifier les 3 conditions</b> de la grève.","<b>Qualifier</b> : grève licite, mouvement illicite, abus.","<b>Tirer les effets</b> pour grévistes, non-grévistes et employeur."]},

"3g":{t:"Transfert d'entreprise",s:"Changement d'employeur",
lead:`<b>En une ligne :</b> si une entité économique autonome change de mains (vente, fusion, succession…), tous les contrats en cours passent au repreneur, aux mêmes conditions.`,
sections:[
{t:"Le principe",h:`
<p>En cas de <b>modification de la situation juridique de l'employeur</b> (succession, vente, fusion, transformation du fonds, mise en société), <b>tous les contrats en cours</b> subsistent avec le nouvel employeur (article L.1224-1).</p>
<p>Le nouvel employeur reprend les <b>obligations</b> de l'ancien à la date du transfert, sauf en sauvegarde, redressement ou liquidation judiciaire.</p>`},
{t:"La condition et les effets",h:`
<p><b>Condition :</b> transfert d'une <b>entité économique autonome</b> : un ensemble organisé de personnes et d'éléments corporels ou incorporels permettant une activité économique avec un objectif propre, qui conserve son identité.</p>
<p><b>Effets :</b> exploitation dans des conditions identiques ; maintien de la fonction, de la rémunération, de l'<b>ancienneté</b>, de la classification (sauf proposition de modification du contrat). Les contrats <b>suspendus</b> (maternité, congé parental, maladie, formation) sont aussi transférés.</p>
<div class="trap">Le transfert s'impose : ni le cédant, ni le repreneur, ni le salarié ne peuvent l'écarter.</div>`}
],
exam:["<b>Repérer</b> la modification de la situation juridique de l'employeur.","<b>Vérifier</b> qu'une entité économique autonome est transférée.","<b>Conclure</b> : maintien des contrats et des droits acquis."]}
});

<script>
const $=s=>document.querySelector(s);
const partOf=id=>+id[0];
let cur=PARTIES[0].fiches[0], openState=false;

/* ---------- FICHES ---------- */
function renderParts(){
  $('#parts').innerHTML=PARTIES.map(p=>`<button class="part ${partOf(cur)===p.id?'on':''}" data-p="${p.id}">${p.titre}<small>${p.sous}</small></button>`).join('');
  document.querySelectorAll('.part').forEach(b=>b.onclick=()=>{cur=PARTIES[+b.dataset.p-1].fiches[0];renderAll();});
}
function renderTabs(){
  const P=PARTIES[partOf(cur)-1];
  $('#ftabs').className='ftabs p'+P.id;
  $('#ftabs').innerHTML=P.fiches.map((id,i)=>`<button class="ftab ${id===cur?'on':''}" data-id="${id}"><span class="n">Fiche ${P.id}.${i+1}</span>${FICHES[id].t}<small>${FICHES[id].s}</small></button>`).join('');
  document.querySelectorAll('.ftab').forEach(b=>b.onclick=()=>{cur=b.dataset.id;renderAll();});
  const on=$('#ftabs .ftab.on'); if(on) on.scrollIntoView({block:'nearest',inline:'center'});
}
function allIds(){return PARTIES.flatMap(p=>p.fiches);}
function renderFiche(){
  const f=FICHES[cur], p=partOf(cur);
  let h=`<div class="lead">${f.lead}</div><div class="p${p}">`;
  f.sections.forEach((s,i)=>{h+=`<details class="card" ${i===0?'open':''}><summary><span class="num">${i+1}</span><h3>${s.t}</h3><span class="chev">›</span></summary><div class="body">${s.h}</div></details>`;});
  h+=`</div><div class="exam"><h3>À l'examen : 3 gestes</h3><ol>${f.exam.map(e=>`<li>${e}</li>`).join('')}</ol></div>`;
  const ids=allIds(), k=ids.indexOf(cur);
  h+=`<div class="fnav"><button id="fprev" ${k===0?'disabled':''}>← ${k>0?FICHES[ids[k-1]].t:''}</button><button id="fnext" ${k===ids.length-1?'disabled':''}>${k<ids.length-1?FICHES[ids[k+1]].t:''} →</button></div>`;
  $('#ficheBody').innerHTML=h;
  $('#fh').textContent='Fiches';
  $('#openAll').style.display='';
  $('#openAll').textContent='Tout ouvrir';
  if(k>0) $('#fprev').onclick=()=>{cur=ids[k-1];renderAll();};
  if(k<ids.length-1) $('#fnext').onclick=()=>{cur=ids[k+1];renderAll();};
  $('#fiches').scrollTop=0;
}
$('#openAll').onclick=()=>{
  const cards=[...document.querySelectorAll('#ficheBody details')];
  const allOpen=cards.every(c=>c.open); cards.forEach(c=>c.open=!allOpen);
  $('#openAll').textContent=allOpen?'Tout ouvrir':'Tout fermer';
};
function renderAll(){ $('#q').value=''; renderParts();renderTabs();renderFiche(); if(scope==='fiche'||scope==='partie'){renderScope();start();} }

/* ---------- RECHERCHE ---------- */
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const strip=h=>h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
$('#q').addEventListener('input',e=>{
  const t=e.target.value.trim();
  if(t.length<2){renderParts();renderTabs();renderFiche();return;}
  const nt=norm(t), hits=[];
  for(const id of allIds()){const f=FICHES[id];
    f.sections.forEach((s,i)=>{const txt=strip(s.h), n=norm(txt), j=n.indexOf(nt);
      if(j>=0||norm(s.t).includes(nt)){const a=Math.max(0,j-60), ex=(a>0?'…':'')+txt.slice(a,(j<0?0:j)+nt.length+90)+'…';
        hits.push({id,i,title:`${f.t} · ${s.t}`,ex});}});}
  $('#fh').textContent='Résultats'; $('#openAll').style.display='none';
  $('#ftabs').innerHTML='';
  const re=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  $('#ficheBody').innerHTML=`<div class="results">${hits.length?hits.slice(0,40).map((h,k)=>`<div class="hit" data-k="${k}"><b>${h.title}</b><span>${h.ex.replace(/</g,'&lt;').replace(re,m=>`<mark>${m}</mark>`)}</span></div>`).join(''):'<div class="empty">Rien trouvé. Essaie un autre mot.</div>'}</div>`;
  document.querySelectorAll('.hit').forEach(el=>el.onclick=()=>{const h=hits[+el.dataset.k];cur=h.id;$('#q').value='';renderParts();renderTabs();renderFiche();
    const c=document.querySelectorAll('#ficheBody details');c.forEach((d,ix)=>d.open=ix===h.i);c[h.i].scrollIntoView({block:'start'});});
});

/* ---------- QUIZ ---------- */
let mode='qcm', scope='all', deck=[], idx=0, score=0, misses=[], answered=false;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function inScope(id){ if(scope==='all')return true; if(scope==='partie')return partOf(id)===partOf(cur); if(scope==='fiche')return id===cur; return partOf(id)===+scope; }
const pool=()=>({qcm:QCM,vf:VF,flash:FLASH}[mode]).filter(q=>inScope(q[0]));
const tag=id=>`<span class="tag t${partOf(id)}">${FICHES[id].t}</span>`;
function renderScope(){
  const opts=[['fiche','Cette fiche'],['partie','Partie '+partOf(cur)],['all','Tout le programme']];
  $('#scope').innerHTML='<label>Questions sur</label>'+opts.map(([v,l])=>`<button class="sbtn ${scope===v?'on':''}" data-s="${v}">${l}</button>`).join('');
  document.querySelectorAll('.sbtn').forEach(b=>b.onclick=()=>{scope=b.dataset.s;renderScope();start();});
}
function start(){
  let p=shuffle(pool());
  if(mode==='qcm') p=p.slice(0,15).map(q=>{const o=shuffle(q[2].map((t,i)=>i));return [q[0],q[1],o.map(i=>q[2][i]),o.indexOf(q[3]),q[4]];});
  if(mode==='vf') p=p.slice(0,12);
  if(mode==='flash') p=p.slice(0,25);
  deck=p; idx=0; score=0; misses=[]; answered=false;
  $('#qcount').textContent=pool().length+' dans la banque';
  render();
}
function head(){const pct=deck.length?idx/deck.length*100:0;return `<div class="progress">${tag(deck[idx][0])}<div class="bar"><i style="width:${pct}%"></i></div><span>${idx+1} / ${deck.length}</span></div>`;}
function render(){
  const st=$('#stage');
  if(!deck.length){st.innerHTML='<div class="result"><p>Pas encore de question dans ce mode pour cette sélection.</p></div>';return;}
  if(idx>=deck.length) return renderEnd();
  const q=deck[idx]; answered=false;
  if(mode==='qcm'){
    st.innerHTML=head()+`<div class="q">${q[1]}</div><div class="opts">${q[2].map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div><div id="fb"></div><div class="actions"><button class="btn" id="next" style="display:none">Suivante →</button></div>`;
    st.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i===q[3],b,q[3],q[4]));
  } else if(mode==='vf'){
    st.innerHTML=head()+`<div class="q">${q[1]}</div><div class="tf"><button class="opt" data-v="1">Vrai</button><button class="opt" data-v="0">Faux</button></div><div id="fb"></div><div class="actions"><button class="btn" id="next" style="display:none">Suivante →</button></div>`;
    st.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer((b.dataset.v==='1')===q[2],b,q[2]?0:1,q[3]));
  } else {
    st.innerHTML=head()+`<div class="flip" id="card"><div class="flip-in"><div class="face front"><div class="q">${q[1]}</div></div><div class="face back">${q[2]}</div></div></div><div class="hint">Touche la carte pour la retourner</div><div class="actions" id="fa" style="visibility:hidden"><button class="btn bad" id="no">À revoir</button><button class="btn good" id="yes">Je savais</button></div>`;
    $('#card').onclick=()=>{$('#card').classList.toggle('on');$('#fa').style.visibility='visible';};
    $('#yes').onclick=()=>{score++;idx++;render();};
    $('#no').onclick=()=>{misses.push(q[1]+' → '+q[2]);idx++;render();};
  }
}
function answer(ok,btn,goodIdx,expl){
  if(answered)return; answered=true;
  const opts=[...document.querySelectorAll('#stage .opt')];
  opts.forEach(o=>o.disabled=true); opts[goodIdx].classList.add('good'); if(!ok)btn.classList.add('bad');
  const q=deck[idx]; if(ok)score++; else misses.push(q[1]+' → '+expl);
  $('#fb').innerHTML=`<div class="feedback ${ok?'ok':'ko'}"><b>${ok?'Bien joué !':'Pas tout à fait.'}</b>${expl}</div>`;
  const n=$('#next'); n.style.display=''; n.textContent=idx===deck.length-1?'Voir mon score':'Suivante →';
  n.onclick=()=>{idx++;render();}; n.focus();
}
function renderEnd(){
  const pct=Math.round(score/deck.length*100);
  const key='ds-best-'+mode+'-'+(scope==='fiche'?cur:scope==='partie'?'p'+partOf(cur):'all'); const best=store.get(key);
  if(best===null||pct>best) store.set(key,pct);
  const msg=pct>=90?'Excellent, tu maîtrises !':pct>=70?'Très bien, encore un petit effort.':pct>=50?'C\'est en bonne voie : relis les points ratés.':'Relis la fiche, puis retente ta chance.';
  $('#stage').innerHTML=`<div class="result"><div class="big">${score}/${deck.length}</div><p>${msg}</p>${best!==null?`<div class="best">Meilleur score précédent : ${best} %</div>`:''}
  ${misses.length?`<div class="review"><b>À revoir :</b>${misses.map(m=>`<div>${m}</div>`).join('')}</div>`:''}</div>
  <div class="actions"><button class="btn" id="again">Recommencer</button></div>`;
  $('#again').onclick=start;
}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x===b));start();});
document.addEventListener('keydown',e=>{
  if(document.activeElement===$('#q'))return;
  if(mode==='qcm'&&!answered&&e.key.length===1&&'abcd1234'.includes(e.key.toLowerCase())){const i='abcd'.indexOf(e.key.toLowerCase());const j=i>=0?i:+e.key-1;const o=document.querySelectorAll('#stage .opt')[j];if(o)o.click();}
});
document.querySelectorAll('.mnav button').forEach(b=>b.onclick=()=>{document.body.dataset.view=b.dataset.view;document.querySelectorAll('.mnav button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0);});

renderParts();renderTabs();renderFiche();renderScope();start();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
