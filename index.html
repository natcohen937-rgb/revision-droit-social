<style>
:root{
  --bg:#f6f3ee; --panel:#fffdf9; --ink:#1d1b26; --muted:#6b6776; --line:#e6e0d6;
  --accent:#3b5bdb; --accent-soft:#e8edff;
  --c1:#e8590c; --c1-soft:#fff0e6; --c2:#0c8599; --c2-soft:#e3f6f8; --c3:#7048e8; --c3-soft:#f0ebff;
  --good:#2b8a3e; --good-soft:#e6f6ea; --bad:#c92a2a; --bad-soft:#fdecec;
  --r:14px; --shadow:0 1px 2px rgba(30,25,40,.05),0 6px 24px rgba(30,25,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque",Inter,sans-serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
header.top{display:flex;align-items:center;gap:14px;padding:calc(14px + env(safe-area-inset-top)) calc(22px + env(safe-area-inset-right)) 14px calc(22px + env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--panel)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:14px}
.top h1{font-size:18px;margin:0;font-weight:700}
.top .sub{color:var(--muted);font-size:13px}
.search{margin-left:auto;position:relative}
.search input{font:inherit;font-size:13.5px;padding:8px 12px 8px 32px;border-radius:999px;border:1px solid var(--line);background:var(--bg);width:230px;outline:none}
.search input:focus{border-color:var(--accent);background:#fff}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);min-height:0}
.pane{overflow:auto;min-height:0;padding:22px 30px 60px}
.pane.left{border-right:1px solid var(--line)}
.pane-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.pane-head h2{margin:0;font-size:24px;font-weight:800}
.pane-head span{color:var(--muted);font-size:13px}
.expand{font-size:13px;color:var(--accent);font-weight:600;margin-left:auto;cursor:pointer}
/* parties + fiches */
.parts{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.part{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13.5px}
.part small{color:var(--muted);font-weight:500;margin-left:4px}
.part.on[data-p="1"]{background:var(--c1);border-color:var(--c1);color:#fff}
.part.on[data-p="2"]{background:var(--c2);border-color:var(--c2);color:#fff}
.part.on[data-p="3"]{background:var(--c3);border-color:var(--c3);color:#fff}
.part.on small{color:rgba(255,255,255,.8)}
.ftabs{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.ftab{flex:none;padding:9px 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13.5px;text-align:left;max-width:220px}
.ftab small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftab .n{font-size:11px;font-weight:700;color:var(--muted);display:block}
.p1 .ftab.on{border-color:var(--c1);background:var(--c1-soft)}
.p2 .ftab.on{border-color:var(--c2);background:var(--c2-soft)}
.p3 .ftab.on{border-color:var(--c3);background:var(--c3-soft)}
.lead{background:var(--ink);color:#fff;border-radius:var(--r);padding:16px 18px;margin-bottom:16px;font-size:15px}
.lead b{color:#ffd8a8}
.fnav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.fnav button{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13.5px}
.fnav button[disabled]{opacity:.35;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.card>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.card>summary::-webkit-details-marker{display:none}
.num{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.p1 .num{background:var(--c1-soft);color:var(--c1)} .p2 .num{background:var(--c2-soft);color:var(--c2)} .p3 .num{background:var(--c3-soft);color:var(--c3)}
.card h3{margin:0;font-size:16.5px;font-weight:700;flex:1}
.chev{transition:transform .2s;color:var(--muted)}
.card[open] .chev{transform:rotate(90deg)}
.body{padding:0 16px 16px 56px;overflow-x:auto}
.body p{margin:0 0 10px}
.body ul,.body ol{margin:0 0 10px;padding-left:18px}.body li{margin:3px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 12px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
td:first-child{font-weight:600}
.tip{background:var(--accent-soft);border-radius:10px;padding:9px 12px;font-size:13.5px;margin:8px 0}
.tip::before{content:"Astuce · ";font-weight:700;color:var(--accent)}
.trap{background:var(--bad-soft);border-radius:10px;padding:9px 12px;font-size:13.5px;margin:8px 0}
.trap::before{content:"Piège · ";font-weight:700;color:var(--bad)}
.exam{border:2px dashed var(--line);border-radius:var(--r);padding:14px 16px;margin-top:6px}
.exam h3{margin:0 0 8px;font-size:16px}
.exam ol{margin:0;padding-left:20px}
mark{background:#ffe066;border-radius:3px;padding:0 1px}
.results .hit{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.results .hit b{display:block;font-size:14px}
.results .hit span{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
/* quiz */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;box-shadow:var(--shadow)}
.mode b{display:block;font-size:14.5px}
.mode span{font-size:12px;color:var(--muted)}
.mode.on{border-color:var(--accent);background:var(--accent-soft)}
.scope{display:flex;gap:6px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.scope label{font-size:13px;color:var(--muted);margin-right:4px}
.sbtn{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600}
.sbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);min-height:340px;display:flex;flex-direction:column}
.progress{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--bg);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag.t1{background:var(--c1-soft);color:var(--c1)} .tag.t2{background:var(--c2-soft);color:var(--c2)} .tag.t3{background:var(--c3-soft);color:var(--c3)}
.q{font-family:"Bricolage Grotesque";font-size:21px;font-weight:700;line-height:1.3;margin:4px 0 18px}
.opts{display:grid;gap:9px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;background:#fff;display:flex;gap:10px;align-items:flex-start;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{width:22px;height:22px;border-radius:6px;background:var(--bg);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.feedback{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:14px}
.feedback.ok{background:var(--good-soft)} .feedback.ko{background:var(--bad-soft)}
.feedback b{display:block;margin-bottom:2px}
.actions{margin-top:auto;padding-top:16px;display:flex;gap:10px;justify-content:flex-end}
.btn{padding:11px 18px;border-radius:12px;font-weight:600;background:var(--ink);color:#fff}
.btn.good{background:var(--good)} .btn.bad{background:var(--bad)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-weight:700;font-size:16px;padding:16px}
.flip{perspective:1200px;flex:1;display:flex;min-height:230px;cursor:pointer}
.flip-in{position:relative;width:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.front{background:var(--accent-soft)}
.front .q{margin:0}
.back{background:var(--ink);color:#fff;transform:rotateY(180deg);font-size:16px}
.hint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
.result{text-align:center;margin:auto 0}
.big{font-family:"Bricolage Grotesque";font-size:56px;font-weight:800;line-height:1}
.result p{color:var(--muted)}
.review{text-align:left;margin-top:14px;font-size:13.5px}
.review div{padding:8px 10px;border-radius:10px;background:var(--bad-soft);margin-bottom:6px}
.best{font-size:12.5px;color:var(--muted);margin-top:10px}
.mnav{display:none}
@media (max-width:860px){
  header.top{flex-wrap:wrap;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
  .search{margin-left:0;width:100%}
  .search input{width:100%}
  main{grid-template-columns:1fr}
  .pane{padding:16px 14px calc(100px + env(safe-area-inset-bottom))}
  .pane.left{border-right:0}
  body[data-view="quiz"] .pane.left,body[data-view="fiches"] .pane.right{display:none}
  .mnav{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--ink);border-radius:18px;padding:6px;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:5}
  .mnav button{flex:1;color:#bbb;padding:10px;border-radius:13px;font-weight:600}
  .mnav button.on{background:#fff;color:var(--ink)}
  .mode span{display:none}
  .body{padding-left:14px}
  .q{font-size:19px}
  th,td{padding:6px 6px}
  table{font-size:12.5px}
}
</style>
</head>
<body data-view="fiches">
<div class="app">
  <header class="top">
    <div class="logo">DS</div>
    <div><h1>Révision Droit social</h1><div class="sub">DCG UE3 · Parties 1, 2 et 3</div></div>
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Chercher : préavis, CSE, 218…" autocomplete="off"></label>
  </header>
  <main>
    <section class="pane left" id="fiches">
      <div class="pane-head"><h2 id="fh">Fiches</h2><span id="openAll" role="button" class="expand" tabindex="0">Tout ouvrir</span></div>
      <div class="parts" id="parts"></div>
      <div class="ftabs" id="ftabs"></div>
      <div id="ficheBody"></div>
    </section>
    <section class="pane right" id="quiz">
      <div class="pane-head"><h2>Entraînement</h2><span id="qcount"></span></div>
      <div class="modes">
        <button class="mode on" data-mode="qcm"><b>QCM</b><span>4 choix, une bonne réponse</span></button>
        <button class="mode" data-mode="vf"><b>Vrai / Faux</b><span>Réponse rapide, pièges inclus</span></button>
        <button class="mode" data-mode="flash"><b>Flashcards</b><span>Retourne, auto-évalue-toi</span></button>
      </div>
      <div class="scope" id="scope"></div>
      <div class="stage" id="stage"></div>
    </section>
  </main>
</div>
<nav class="mnav">
  <button data-view="fiches" class="on">Fiches</button>
  <button data-view="quiz">Quiz</button>
</nav>
<script>
const PARTIES=[], FICHES={}, QCM=[], VF=[], FLASH=[];
</script>
<script>
/* ================= TOME 1 · Partie 1 : le contexte juridique du droit social ================= */
PARTIES.push({id:1,titre:"Partie 1",sous:"Le contexte juridique du droit social",fiches:["1a","1b","1c","1d","1e","1f","1g","1h"]});

Object.assign(FICHES,{
"1a":{t:"Contrat de travail",s:"Définitions, qualification, requalification",
lead:`<b>En une ligne :</b> il y a contrat de travail dès que 3 critères sont réunis, <b>prestation + rémunération + lien de subordination</b>, quel que soit le nom que les parties ont donné à leur contrat.`,
sections:[
{t:"Le droit social : deux branches",h:`
<table><tr><th>Branche</th><th>Objet</th></tr>
<tr><td>Droit du travail</td><td>Les rapports juridiques nés du travail exécuté <b>pour le compte et sous la subordination d'autrui</b> (employeur privé ou EPIC). Ne couvre pas le bénévolat, le travail indépendant ni la fonction publique.</td></tr>
<tr><td>Droit de la Sécurité sociale</td><td>Créé le <b>4 octobre 1945</b> : organise la couverture sociale de toute la population (travailleurs et familles).</td></tr></table>`},
{t:"Les caractères du droit du travail",h:`
<table><tr><th>Dimension</th><th>Contenu</th></tr>
<tr><td>Individuelle : protéger le salarié</td><td>Le salarié est la partie faible (lien de subordination). Le droit encadre les pouvoirs de l'employeur (<b>direction, disciplinaire, réglementaire</b>) et garantit des minima : SMIC, durée du travail, santé-sécurité, non-discrimination, protection contre le licenciement. <b>Ordre public social</b> : on ne déroge que dans un sens plus favorable au salarié.</td></tr>
<tr><td>Collective : représenter les salariés</td><td>Contrepoids au pouvoir patronal : liberté syndicale, négociation collective, IRP (CSE, délégués syndicaux), droit de grève. Produit des normes négociées souvent plus favorables que la loi.</td></tr></table>
<p>Les deux se complètent : l'individuel fixe un <b>socle minimal</b>, le collectif l'<b>améliore</b> par la négociation. Le droit du travail est à la fois <b>protecteur et négocié</b>.</p>`},
{t:"Les 3 critères du contrat de travail",h:`
<p><b>Pas de définition légale</b> : c'est la jurisprudence qui l'a construite. Le contrat de travail est la convention par laquelle une personne (le salarié) met son activité à la disposition d'une autre (l'employeur), sous la subordination de laquelle elle se place, moyennant rémunération.</p>
<table><tr><th>Critère (cumulatif)</th><th>En clair</th></tr>
<tr><td>Prestation de travail</td><td>La fonction occupée par le salarié</td></tr>
<tr><td>Rémunération</td><td>Salaire et compléments de salaire</td></tr>
<tr><td>Lien de subordination</td><td>L'employeur a le pouvoir de <b>donner des ordres et directives, d'en contrôler l'exécution et de sanctionner</b> les manquements</td></tr></table>
<div class="tip">Les 3 pouvoirs du lien de subordination : <b>ordonner, contrôler, sanctionner</b>.</div>
<p>La jurisprudence répète : l'existence d'une relation de travail « ne dépend ni de la volonté exprimée par les parties ni de la dénomination qu'elles ont donnée à leur convention, mais des <b>conditions de fait</b> dans lesquelles est exercée l'activité ».</p>`},
{t:"Présomption de non-salariat",h:`
<p>Sont <b>présumés ne pas être salariés</b> du donneur d'ordre, pour l'activité qui a donné lieu à immatriculation :</p>
<ul><li>les personnes physiques immatriculées au RCS, au registre national des entreprises (métiers et artisanat), au registre des agents commerciaux ou auprès de l'URSSAF (allocations familiales) ;</li>
<li>les personnes inscrites au registre des transports routiers de personnes (transport scolaire ou à la demande) ;</li>
<li>les dirigeants des personnes morales immatriculées au RCS et leurs salariés.</li></ul>
<p>C'est une <b>présomption simple</b> : on peut prouver un contrat de travail si la personne fournit ses prestations dans un <b>lien de subordination juridique permanente</b>.</p>
<p>Si le donneur d'ordre s'est <b>intentionnellement</b> soustrait à ses obligations de déclaration : <b>travail dissimulé</b>. S'il est condamné pénalement, il doit payer les cotisations et contributions patronales sur les sommes versées pendant la période de dissimulation.</p>`},
{t:"Ne pas confondre avec…",h:`
<table><tr><th>Contrat</th><th>Définition</th><th>Différence clé</th></tr>
<tr><td>Contrat d'entreprise</td><td>Une personne s'oblige, contre rémunération, à exécuter un travail <b>de façon indépendante</b>. Client = maître de l'ouvrage ; prestataire = entrepreneur, artisan.</td><td>Pas de subordination</td></tr>
<tr><td>Contrat de mandat</td><td>Le mandant confie au mandataire la mission d'accomplir pour son compte des <b>actes juridiques</b> (en principe avec représentation).</td><td>Objet = actes juridiques</td></tr>
<tr><td>Contrat de société</td><td>Des associés affectent des <b>apports</b> à une entreprise commune pour partager les bénéfices ou profiter des économies.</td><td>Apports, partage des bénéfices</td></tr>
<tr><td>Bénévolat</td><td>Activité libre, <b>sans rémunération ni subordination</b>, au profit d'une association ou d'un organisme sans but lucratif.</td><td>Requalification si contrepartie financière significative + directives, contrôle, sanctions</td></tr></table>
<p><b>Hors droit du travail :</b> fonctionnaires et agents publics, travailleurs indépendants (artisans, professions libérales, commerçants), dirigeants sociaux sans lien de subordination distinct de leur mandat.</p>`},
{t:"Le pouvoir de requalification du juge",h:`
<p>Le juge <b>n'est pas lié</b> par la qualification choisie par les parties (prestation de services, mandat, statut d'indépendant…). Il applique la <b>méthode du faisceau d'indices</b> : prestation, rémunération et <b>surtout</b> lien de subordination juridique.</p>
<p>Si la subordination est caractérisée, il <b>requalifie en contrat de travail</b>, avec toutes les conséquences : <b>rappels de salaires, cotisations sociales, indemnités de rupture</b>.</p>
<div class="trap">Un « auto-entrepreneur » qui reçoit des ordres, des horaires et des sanctions d'un seul client peut être requalifié salarié : le nom du contrat ne protège pas.</div>`}
],
exam:["<b>Rappeler</b> les 3 critères cumulatifs (prestation, rémunération, subordination).","<b>Chercher les indices</b> de subordination dans les faits : ordres, contrôle, sanctions.","<b>Conclure</b> : requalification et conséquences (salaires, cotisations, indemnités)."]},

"1b":{t:"Protection sociale",s:"Régimes, prestations, cotisations",
lead:`<b>En une ligne :</b> la Sécurité sociale couvre les risques sociaux par branches, finance surtout ses prestations par les cotisations (≈ 80 %), et se complète par une protection complémentaire obligatoire ou facultative.`,
sections:[
{t:"Principes, risques, affiliation",h:`
<table><tr><th>Principe fondateur</th><th>Sens</th></tr>
<tr><td>Unité</td><td>Un système unique a vocation à couvrir toute la population, quelle que soit l'activité</td></tr>
<tr><td>Universalité</td><td>Tous les risques et toutes les personnes ont vocation à être couverts</td></tr>
<tr><td>Uniformité</td><td>Les prestations tendent à être identiques quel que soit le régime (des différences subsistent)</td></tr></table>
<p><b>Risques couverts :</b> maladie, maternité, invalidité, décès ; AT-MP ; vieillesse ; famille ; chômage. Chaque risque = une branche, avec des <b>prestations en nature</b> (remboursement de soins) et/ou <b>en espèces</b> (IJ, pensions, rentes, allocations).</p>
<table><tr><th>Notion</th><th>Définition</th></tr>
<tr><td>Assujettissement</td><td>Reconnaissance de la qualité d'assuré social au regard d'un régime</td></tr>
<tr><td>Affiliation</td><td>Rattachement à la caisse compétente (CPAM, CAF), le plus souvent selon le domicile</td></tr>
<tr><td>Immatriculation</td><td>Attribution du numéro de sécurité sociale (13 chiffres + clé de 2, immuable)</td></tr></table>`},
{t:"Les acteurs",h:`
<table><tr><th>Organisme</th><th>Rôle</th></tr>
<tr><td>CPAM (local)</td><td>Droit privé, mission de service public : immatricule, affilie, sert les prestations</td></tr>
<tr><td>Carsat (régional)</td><td>Tarification AT-MP ; calcul, gestion et paiement des retraites</td></tr>
<tr><td>CNAM (national)</td><td>Établissement public administratif : gestion nationale maladie, maternité, AT-MP ; prévention, contrôle médical, coordination</td></tr>
<tr><td>CNAV</td><td>Centralise les droits vieillesse ; liquidation confiée aux Carsat</td></tr>
<tr><td>CNAF / CAF</td><td>Financement des prestations familiales / versement</td></tr>
<tr><td>ACOSS</td><td>Gestion commune de la trésorerie des régimes</td></tr>
<tr><td>URSSAF</td><td>Recouvrement des cotisations</td></tr>
<tr><td>État</td><td>Tutelle : le Parlement vote la loi de financement ; contrôle du ministère des Finances et de la Cour des comptes</td></tr></table>`},
{t:"Les régimes",h:`
<table><tr><th>Régime</th><th>Qui</th><th>Particularité</th></tr>
<tr><td>Général</td><td>Salariés du privé + assimilés (président du CA, DG, membres du directoire de SA)</td><td>Branches : maladie, AT-MP, vieillesse, famille</td></tr>
<tr><td>Agricole</td><td>Salariés et exploitants agricoles</td><td><b>MSA</b> = guichet unique (recouvrement + prestations)</td></tr>
<tr><td>Indépendants</td><td>Commerçants, artisans, libéraux, micro-entrepreneurs</td><td>RSI supprimé en 2018 : intégrés au régime général (URSSAF, CPAM). Cotisations sur le revenu professionnel ; AT non obligatoirement couverts</td></tr></table>
<p><b>Assujettissement au régime général :</b></p>
<ul><li><b>À titre principal :</b> salariés liés par un contrat de travail (sauf agricoles), quels que soient âge, nationalité, montant ou validité du contrat ;</li>
<li><b>Par extension légale :</b> artistes du spectacle, mannequins, journalistes, dirigeants non majoritaires, retraités… ;</li>
<li><b>Comme ayant droit :</b> conjoint, concubin ou partenaire de PACS sans protection, enfants à charge (moins de 16 ans ; moins de 20 ans s'ils étudient ou sont infirmes).</li></ul>
<p>Formalités : l'employeur immatricule (ou vérifie l'immatriculation du) salarié <b>dans les 8 jours</b> de l'embauche, et s'immatricule lui-même à l'URSSAF dans les 8 jours de la 1re embauche (contravention de 3e classe).</p>`},
{t:"Conditions des indemnités journalières",h:`
<table><tr><th>Arrêt</th><th>Conditions</th></tr>
<tr><td>Jusqu'à 6 mois</td><td><b>150 h</b> sur les 3 mois civils (ou 90 jours) précédents, <b>ou</b> cotisations sur au moins <b>1 015 × SMIC horaire</b> sur 6 mois</td></tr>
<tr><td>Plus de 6 mois</td><td><b>12 mois</b> d'affiliation + <b>600 h</b> sur 12 mois (ou 365 jours), <b>ou</b> cotisations sur <b>2 030 × SMIC horaire</b></td></tr>
<tr><td>Maternité</td><td>Cesser toute activité ; immatriculée depuis <b>6 mois</b> à la date présumée d'accouchement ; 150 h sur 3 mois ou 1 015 × SMIC sur 6 mois</td></tr></table>
<p>Pendant l'arrêt : aucune activité sauf autorisation du médecin. Aucune condition pour un 1er emploi au régime général ni pour les moins de 25 ans. Informer employeur et CPAM sous <b>48 h</b>.</p>`},
{t:"Les prestations",h:`
<table><tr><th>Branche</th><th>À retenir</th></tr>
<tr><td>Maladie</td><td>En nature (soins, médicaments, hospitalisation) avec <b>ticket modérateur</b> (reste à charge) ; en espèces = IJSS</td></tr>
<tr><td>Maternité</td><td>Déclaration de grossesse dans les <b>14 premières semaines</b> ; IJ = salaire journalier de base (moyenne des 3 mois avant le congé, dans la limite du plafond)</td></tr>
<tr><td>Invalidité</td><td>Pension si réduction durable d'au moins <b>2/3</b> de la capacité de travail ; moins de <b>60 ans</b> ; 12 mois d'immatriculation ; 600 h ou 2 030 × SMIC</td></tr>
<tr><td>Décès</td><td>Capital de <b>3 476 €</b> versé en priorité aux personnes à charge ; hors droits de succession, CSG, CRDS, cotisations</td></tr>
<tr><td>Accident de trajet</td><td>Résidence ↔ travail, ou travail ↔ lieu de repas, sans détour personnel (détour admis pour covoiturage régulier). <b>Preuve à la charge du salarié</b> ; déclaration à l'employeur sous <b>24 h</b></td></tr>
<tr><td>AT-MP</td><td>Pas de ticket modérateur ni forfait hospitalier. IJ = <b>60 %</b> du gain journalier les 28 premiers jours, puis <b>80 %</b> ; jour de l'accident payé par l'employeur. Incapacité permanente : capital si taux &lt; 10 %, rente au-delà ; prestation complémentaire si ≥ 80 % + tierce personne. Décès : rente aux ayants droit. Employeur : <b>immunité civile</b> en principe</td></tr>
<tr><td>Vieillesse</td><td><b>P = SR × T × (D/d)</b> : salaire des 25 meilleures années × taux (37,5 à 50 %) × durée d'assurance / durée de référence. Pension faible (salaires plafonnés) d'où les complémentaires obligatoires</td></tr></table>`},
{t:"Les fautes en matière d'AT-MP",h:`
<table><tr><th>Faute</th><th>De l'employeur</th><th>Du salarié</th></tr>
<tr><td>Inexcusable</td><td>Manquement à l'obligation de sécurité : il aurait dû avoir conscience du danger et n'a rien fait. Action de la caisse, de la victime ou des ayants droit → <b>majoration du capital ou de la rente</b></td><td>Faute volontaire d'une exceptionnelle gravité, exposant sans raison à un danger connu → la caisse peut <b>diminuer la rente</b></td></tr>
<tr><td>Intentionnelle</td><td>Acte volontaire pour causer des lésions → sort du régime AT-MP : <b>droit commun de la responsabilité civile, réparation intégrale</b></td><td>Acte volontaire contre soi-même → la caisse peut <b>diminuer la rente</b></td></tr></table>`},
{t:"Le financement",h:`
<p>≈ <b>80 %</b> par les cotisations salariales et patronales, le reste par impôts, taxes et subventions.</p>
<table><tr><th>Dans l'assiette</th><th>Hors assiette</th></tr>
<tr><td>Salaire de base, pourboires, avantages en nature, primes, indemnités de congés payés et de préavis, indemnité de départ en retraite, de fin de CDD, de non-concurrence, chômage partiel, indemnités de licenciement, IJ versées par l'employeur…</td><td>Remboursements de frais professionnels, prestations de Sécurité sociale (IJSS), <b>intéressement et participation</b>, dommages-intérêts</td></tr></table>
<ul><li><b>CSG</b> : sur revenus d'activité, de remplacement, du patrimoine et de placement. <b>CRDS</b> : 0,5 % pour résorber la dette sociale.</li>
<li><b>Forfait social</b> (employeur) : sur les éléments exonérés de cotisations mais soumis à CSG (participation dès 50 salariés, intéressement dès 250, retraite et mutuelle complémentaires, abondements PEE/PER, jetons de présence). Pas dû : participation &lt; 50 salariés, intéressement jusqu'à 250, prévoyance, actions gratuites…</li>
<li>Contribution solidarité autonomie ; <b>pénalité seniors</b> de 1 % de la masse salariale (≥ 50 salariés sans dispositif) ; taxes alcool et tabac.</li></ul>
<p><b>Recouvrement :</b> l'employeur retient la part salariale (le <b>précompte</b>) et verse le tout à l'URSSAF : dans les 15 jours de chaque mois (moins de 9 salariés) ou de chaque trimestre (9 et plus), avec la <b>DSN</b>. Privilège de l'URSSAF à inscrire au-delà de 12 000 € sur 3 mois. Prescription <b>3 ans</b>. Retard : 5 % de l'impayé. Non-paiement volontaire = élément du <b>travail dissimulé</b> (3 ans, 45 000 €).</p>`},
{t:"La protection complémentaire",h:`
<table><tr><th>Obligatoire</th><th>Facultative</th></tr>
<tr><td>Généralisée par l'<b>ANI 2013</b> (loi du 14 juin 2013) : depuis le <b>1er janvier 2016</b>, complémentaire santé collective financée à <b>50 % au moins</b> par l'employeur. Prévoyance parfois imposée par la branche (cadres).</td><td>Démarche volontaire : contrats individuels (mutuelle, PER individuel) ou dispositifs d'entreprise au-delà du socle (surcomplémentaire, PER collectif)</td></tr></table>
<p><b>Retraite complémentaire :</b> AGIRC-ARRCO (fusion 2019), gestion paritaire, affiliation obligatoire, système <b>par points</b> mais par répartition. Pension = points × valeur du point. Âge 62/64 ans, liquidation minorée possible dès 57 ans. Litiges : TJ.</p>
<p><b>Complémentaire santé :</b> mise en place par accord de branche, accord d'entreprise, référendum (s'impose à chacun), décision unilatérale de l'employeur (applicable à tous mais pas imposée à chacun) ou proposition du CSE. Exclusion possible des salariés de moins de 6 mois d'ancienneté. Dispenses : DUE sans prise en charge à 100 %, cas du contrat, bénéficiaires de la CMU-C, CDD de moins de 12 mois. Forfait social de 8 % au-delà de 10 salariés.</p>`}
],
exam:["<b>Identifier</b> le régime de la personne (salarié, assimilé, agricole, indépendant).","<b>Vérifier</b> les conditions d'ouverture des droits (heures, durée d'affiliation).","<b>Qualifier</b> l'événement (maladie, trajet, AT) et en déduire l'indemnisation."]},

"1c":{t:"Syndicats",s:"Effectif, représentativité, DS et RSS",
lead:`<b>En une ligne :</b> les seuils d'effectif déclenchent les obligations ; un syndicat doit être représentatif (10 % en entreprise) pour désigner un délégué syndical, seul habilité à négocier.`,
sections:[
{t:"Calculer l'effectif",h:`
<p>Les obligations dépendent de seuils : élections dès <b>11</b> salariés, règlement intérieur dès <b>50</b>, emploi de travailleurs handicapés, participation… Calcul en <b>équivalent temps plein sur 12 mois consécutifs</b>.</p>
<table><tr><th>On inclut</th><th>On exclut</th></tr>
<tr><td>CDI temps plein ; temps partiel au prorata ; CDD au prorata du temps de présence ; intérimaires</td><td>Remplaçants de salariés absents ; salariés représentant le chef d'entreprise ; apprentis, contrats de professionnalisation</td></tr></table>
<p>Un résultat décimal s'arrondit à l'<b>entier supérieur</b>.</p>`},
{t:"La liberté syndicale",h:`
<p>Principe fondamental consacré par le <b>Préambule de 1946</b>, le Code du travail et les conventions de l'OIT.</p>
<ul><li><b>Aspect positif :</b> adhérer au syndicat de son choix, créer une section ou un syndicat, sans autorisation de l'employeur.</li>
<li><b>Aspect négatif :</b> nul ne peut être contraint d'adhérer ou de rester. Clause de « closed shop » (embauche réservée aux syndiqués) <b>nulle</b> ; droit de se retirer à tout moment ; aucune cotisation forcée.</li>
<li>Interdiction de toute discrimination syndicale (embauche, sanction, licenciement, promotion), dans les deux sens.</li></ul>
<p><b>Constitution :</b> rédaction des statuts, <b>dépôt en mairie</b> (le maire informe le procureur). Personnalité juridique <b>dès le dépôt</b>. Objet exclusif : étude et défense des intérêts des personnes visées par les statuts. Seuls les syndicats négocient les accords collectifs ; ils peuvent agir en justice pour l'intérêt collectif de la profession.</p>
<p>En entreprise : interdiction à l'employeur de faire pression, de prélever les cotisations sur le salaire ou de les payer à la place du salarié. Le syndicat peut réclamer 6 mois de cotisation après un retrait.</p>`},
{t:"Les 7 critères de représentativité",h:`
<div class="tip">Cumulatifs : <b>valeurs républicaines, indépendance, transparence financière, ancienneté de 2 ans</b> (dépôt des statuts), <b>audience, influence</b> (activité, expérience), <b>effectifs d'adhérents et cotisations</b>.</div>
<table><tr><th>Niveau</th><th>Audience requise</th></tr>
<tr><td>Entreprise / établissement</td><td><b>10 %</b> des suffrages au 1er tour des dernières élections des titulaires au CSE (même sans quorum, on dépouille)</td></tr>
<tr><td>Groupe</td><td>10 % en additionnant les suffrages de tout le groupe (pas dans chaque entreprise)</td></tr>
<tr><td>Branche</td><td><b>8 %</b> (élections CSE + scrutin TPE) + implantation territoriale équilibrée</td></tr>
<tr><td>National interprofessionnel</td><td><b>8 %</b> (élections CSE + scrutin TPE)</td></tr></table>
<p>Représentatifs au national (arrêté du 8 juillet 2025) : <b>CFDT</b> 30,88 %, <b>CGT</b> 25,70 %, <b>FO</b> 17,27 %, <b>CFE-CGC</b> 15,01 %, <b>CFTC</b> 11,14 %. Côté patronal : <b>MEDEF, CPME, U2P</b>.</p>
<p><b>TPE (moins de 11) :</b> commissions paritaires régionales interprofessionnelles (CPRI), 20 membres (10 salariés, 10 employeurs, parité femmes-hommes) : informent, conseillent, facilitent la résolution amiable des conflits, proposent des activités sociales et culturelles. Accès aux entreprises sur autorisation de l'employeur.</p>`},
{t:"La section syndicale",h:`
<p>Création possible avec au moins <b>2 adhérents</b> et l'une des conditions : syndicat représentatif dans l'entreprise, <b>ou</b> affilié à une organisation représentative au niveau national, <b>ou</b> valeurs républicaines + indépendance + 2 ans d'ancienneté.</p>
<p>Moyens : collecter les cotisations dans l'entreprise, panneau d'affichage, tracts aux heures d'entrée et de sortie, intranet ou messagerie si un accord le prévoit (sinon sous conditions de sécurité et de liberté de refuser les messages), une réunion par mois hors temps de travail.</p>`},
{t:"RSS ou DS ?",h:`
<table><tr><th></th><th>RSS</th><th>Délégué syndical</th></tr>
<tr><td>Quand</td><td>Syndicat <b>non représentatif</b></td><td>Syndicat <b>représentatif</b></td></tr>
<tr><td>Négocie ?</td><td><b>Non</b>, sinon mêmes prérogatives que le DS</td><td><b>Oui</b> : salaires, durée du travail, égalité pro, handicap ; épargne salariale, prévoyance, droit d'expression si pas d'accord</td></tr>
<tr><td>Désignation</td><td>Dès 50 salariés ; en dessous, un élu du CSE. LRAR à l'employeur + affichage</td><td>18 ans, 1 an d'ancienneté (4 mois si création), adhérent, droits civiques. <b>Dès 50 :</b> candidat ayant eu <b>10 % sur son nom</b> dans son collège. <b>Moins de 50 :</b> un élu du CSE</td></tr>
<tr><td>Heures</td><td>Au moins <b>4 h/mois</b></td><td><b>12 h</b> (50-150), <b>18 h</b> (151-499), <b>24 h</b> (500 et +)</td></tr>
<tr><td>Fin</td><td>Aux élections suivantes. Non représentatif : pas de nouvelle désignation, sauf dans les <b>6 mois</b> avant les élections suivantes. Représentatif : peut devenir DS</td><td>Aux élections suivantes, démission, ou effectif sous 50 (avec accord)</td></tr></table>
<p><b>Nombre de DS :</b> 1 (50-999), 2 (1 000-1 999), 3 (2 000-3 999), 4 (4 000-9 999), 5 au-delà. <b>DS central</b> : dès 2 000 salariés avec 2 établissements d'au moins 50 (syndicat à 10 % sur l'ensemble) ; en dessous de 2 000, un DS d'établissement peut cumuler.</p>
<p>Points communs : assistent le salarié à l'entretien disciplinaire et aux prud'hommes, se déplacent librement, statut de <b>salarié protégé</b>. Heures de délégation = temps de travail, <b>payées à l'échéance normale</b>, présumées bien utilisées (l'employeur paie avant de contester ; l'élu doit ensuite préciser leur usage). Moins de 300 salariés : le DS est de droit représentant syndical au CSE.</p>`}
],
exam:["<b>Calculer l'effectif</b> pour savoir quelles obligations s'appliquent.","<b>Vérifier la représentativité</b> (10 %) avant de parler de DS.","<b>Contrôler la désignation</b> (âge, ancienneté, 10 % personnels, LRAR)."]},

"1d":{t:"CSE et salariés protégés",s:"Élections, moyens, BDESE, délit d'entrave",
lead:`<b>En une ligne :</b> le CSE est obligatoire dès 11 salariés ; ses pouvoirs grandissent à 50 ; ses membres sont protégés et ne peuvent être licenciés sans autorisation de l'inspecteur du travail.`,
sections:[
{t:"Mise en place et élections",h:`
<p>Instance <b>unique</b> qui a fusionné DP, CE et CHSCT. Obligatoire dès <b>11 salariés pendant 12 mois consécutifs</b> (facultatif en dessous, par accord). Élection tous les <b>4 ans</b>, scrutin dans les <b>90 jours</b> de l'information des salariés, secret (enveloppe ou vote électronique).</p>
<table><tr><th></th><th>Électeur</th><th>Éligible</th></tr>
<tr><td>Âge</td><td>16 ans</td><td>18 ans</td></tr>
<tr><td>Ancienneté</td><td>3 mois</td><td>1 an</td></tr>
<tr><td>Exclus</td><td>Interdits de droits civiques</td><td>+ conjoint, partenaire, concubin, ascendants, descendants, frères, sœurs et alliés de l'employeur</td></tr></table>
<p>L'inspecteur du travail peut accorder des dérogations. Un temps partiel multi-employeurs n'est éligible que dans une entreprise.</p>
<p><b>Scrutin de liste à 2 tours, représentation proportionnelle à la plus forte moyenne.</b> 1er tour : <b>monopole syndical</b> + quorum de la moitié des inscrits par collège. 2e tour dans les <b>15 jours</b> si carence de candidats, quorum non atteint ou sièges vacants : candidatures libres.</p>`},
{t:"Fonctionnement",h:`
<ul><li><b>Composition :</b> l'employeur + une délégation du personnel (autant de titulaires que de suppléants). DS membre de droit sous 300 salariés ; au-delà, chaque syndicat représentatif peut désigner un représentant. Médecin du travail et responsable sécurité aux réunions santé-sécurité.</li>
<li><b>Mandat :</b> 4 ans (2 ou 3 par accord) ; <b>3 mandats successifs</b> maximum (sauf moins de 50 salariés ou accord).</li>
<li><b>Budgets :</b> fonctionnement = <b>0,20 %</b> de la masse salariale brute (50 à 2 000 salariés), <b>0,22 %</b> au-delà ; activités sociales et culturelles fixé par accord. L'excédent de fonctionnement peut passer aux ASC.</li>
<li><b>Réunions :</b> 11-49 : 1 par mois. 50 et + : par accord, au moins 6 par an ; à défaut tous les mois (plus de 300) ou tous les 2 mois (moins de 300). Ordre du jour fixé par l'employeur et le secrétaire ; décisions à la majorité des présents ; PV par le secrétaire ; local fourni.</li>
<li><b>Heures :</b> au moins <b>10 h/mois</b> (moins de 50), <b>18 h/mois</b> (50 et +). Ex. : 11-24 sal. = 1 titulaire, 10 h ; 50-74 = 4 titulaires × 18 h = 72 h. Temps de réunion et formation (5 jours max pour un 1er mandat) non déduits.</li>
<li><b>Commissions :</b> santé-sécurité-conditions de travail, formation, logement, égalité pro dès <b>300</b> ; économique dès <b>1 000</b> ; marchés.</li></ul>`},
{t:"Missions",h:`
<p><b>Dans toutes les entreprises :</b> présenter les réclamations individuelles ou collectives (salaires, Code du travail, conventions) ; promouvoir santé, sécurité, conditions de travail ; enquêter sur les AT-MP ; saisir l'inspection du travail.</p>
<p><b>Dès 50 salariés :</b> expression collective des salariés dans les décisions de gestion. <b>Information-consultation</b> sur la marche de l'entreprise (effectifs, organisation, durée du travail, nouvelles technologies, handicap) et consultations sur : orientations stratégiques, situation économique et financière, politique sociale, moyens de contrôle des salariés, restructurations, licenciement économique collectif, OPA, procédures collectives. Aussi consulté pour une inaptitude ou le licenciement d'un salarié protégé.</p>
<p><b>Santé-sécurité :</b> analyse des risques (femmes enceintes notamment), accès des femmes et des handicapés aux emplois, prévention du harcèlement et des agissements sexistes, inspections régulières.</p>
<p><b>Droits d'alerte :</b> atteinte aux droits des personnes ; danger grave et imminent (santé publique, environnement) ; situation économique préoccupante ; recours abusif aux CDD.</p>
<p>2 membres siègent avec <b>voix consultative</b> au conseil d'administration ou de surveillance et peuvent assister aux AG.</p>`},
{t:"La BDESE",h:`
<p>Obligatoire dès <b>50 salariés</b> (effectif apprécié au niveau de l'entreprise). Mise en place et tenue à jour par l'employeur, accessible <b>en permanence</b> au CSE. Son absence = <b>délit d'entrave</b>. Incomplète ? Le CSE saisit le <b>TJ</b>.</p>
<p><b>Sans accord</b> (moins de 300 salariés), rubriques : investissement social, investissement matériel et immatériel, égalité femmes-hommes, fonds propres-endettement-impôts, rémunérations des salariés et dirigeants, activités sociales et culturelles, rémunération des financeurs, flux financiers reçus, partenariats, transferts intra-groupe. Période : <b>année en cours + 2 années précédentes + 3 années à venir</b>.</p>
<p><b>Avec accord majoritaire :</b> organisation et contenu libres, suppression possible des années passées et futures.</p>`},
{t:"Les salariés protégés",h:`
<p>DS, élus du CSE, représentants syndicaux au CSE, salariés mandatés, conseillers prud'hommes… Toute <b>modification du contrat ou des conditions de travail, transfert ou rupture</b> exige une procédure spéciale.</p>
<ol><li><b>Consultation du CSE</b> (sauf pour un DS).</li>
<li>Demande d'<b>autorisation expresse</b> à l'inspecteur du travail dans les <b>15 jours</b> de la consultation. Le silence ne vaut pas accord.</li>
<li>Recours hiérarchique au <b>ministre du Travail</b> dans les <b>2 mois</b> ; il a <b>4 mois</b> pour statuer. Annulation de l'autorisation → réintégration à la demande du salarié. Annulation du refus → vaut autorisation.</li>
<li>Puis procédure classique : convocation, entretien préalable, notification.</li></ol>
<div class="trap">Procédure non respectée : licenciement <b>nul</b> (réintégration possible) <b>et</b> délit d'entrave.</div>`},
{t:"Le délit d'entrave",h:`
<p>Atteinte à la libre désignation ou à l'exercice régulier des fonctions d'un élu ou d'un DS : refus d'organiser les élections, licenciement d'un protégé sans procédure, refus d'informer, gêne aux missions…</p>
<p>Peine : <b>1 an d'emprisonnement et 7 500 €</b>. Il faut les 3 éléments : <b>légal, moral (intention), matériel</b>. Poursuites sur plainte ou PV de l'inspecteur ; délai de <b>3 ans</b>.</p>`}
],
exam:["<b>Vérifier le seuil</b> (11, 50, 300) et l'obligation qui en découle.","<b>Contrôler la procédure</b> électorale ou de licenciement du protégé.","<b>Tirer la sanction</b> : nullité, réintégration, délit d'entrave."]},

"1e":{t:"Inspection et URSSAF",s:"Contrôles, sanctions, travail illégal",
lead:`<b>En une ligne :</b> l'inspecteur du travail contrôle tout le droit du travail et peut entrer sans prévenir ; l'URSSAF contrôle les cotisations selon une procédure contradictoire ; le travail illégal est lourdement sanctionné.`,
sections:[
{t:"L'organisation de l'inspection",h:`
<table><tr><th>Organe</th><th>Rôle</th></tr>
<tr><td>CNIT</td><td>Instance consultative indépendante : veille à l'<b>impartialité</b> ; reçoit les plaintes contre un agent et rend un avis</td></tr>
<tr><td>DGT</td><td>Autorité centrale : oriente la politique du travail, applique les conventions OIT, veille à la déontologie, autorité sur les services déconcentrés</td></tr>
<tr><td>DREETS</td><td>Principal service déconcentré : unités territoriales (départements) divisées en sections d'inspection</td></tr></table>`},
{t:"Missions et pouvoirs de l'inspecteur",h:`
<p><b>Missions :</b> contrôler (Code, conventions : santé, IRP, durée, contrats, travail illégal), conseiller et informer, faciliter la conciliation des conflits collectifs.</p>
<p><b>Pouvoirs d'investigation :</b> entrer <b>sans avertissement</b> (y compris locaux d'hébergement), interroger les salariés, exiger documents et registres, faire des prélèvements, vérifier l'identité (travail dissimulé), recourir à des organismes agréés.</p>
<p><b>Suites :</b> observations, mises en demeure, contrôles techniques, <b>PV</b> pour les infractions, saisine du juge des référés (activité dangereuse, travail dominical), <b>arrêt temporaire</b> des travaux en cas de danger grave et imminent ou d'agent chimique. Observations santé-sécurité conservées <b>5 ans</b> et communiquées aux IRP et au médecin du travail.</p>
<p><b>Obligations :</b> impartialité, confidentialité des plaintes, discrétion, secret professionnel, information, probité. <b>Droits :</b> indépendance, libre décision des suites, protection.</p>
<p><b>Délit d'obstacle :</b> <b>1 an et 37 500 €</b> ; outrages et violences punis comme envers un OPJ. <b>Transaction pénale</b> possible (infraction punie de moins d'un an) : acceptée par l'auteur et homologuée par le procureur.</p>
<p><b>Saisine obligatoire par l'employeur :</b> rupture conventionnelle ou licenciement d'un protégé, dérogation aux durées maximales, horaires individualisés sans IRP, transmission du règlement intérieur.</p>`},
{t:"Le contrôle URSSAF",h:`
<ol><li><b>Avis de contrôle</b> préalable (date, documents, période). Pas d'avis en cas de recherche de travail dissimulé.</li>
<li>Vérification de l'assiette, du taux et du calcul.</li>
<li><b>Lettre d'observations</b> : objet, documents, période, date de fin, délai de 30 jours.</li>
<li><b>Période contradictoire de 30 jours</b> (réponse en LRAR), prolongeable de 30 jours sur demande (acceptée si pas de réponse), sauf abus de droit ou travail illégal. Assistance d'un conseil ; réponse écrite et motivée du contrôleur. Pas de mise en demeure pendant ce délai.</li>
<li>Issue : observations pour l'avenir, <b>crédit</b> remboursé sous 4 mois, ou <b>mise en demeure</b> en LRAR.</li>
<li>Contestation : <b>commission de recours amiable</b> dans les <b>2 mois</b> de la mise en demeure, puis <b>TJ</b> dans les 2 mois.</li></ol>
<p><b>Sur place</b> ou <b>sur pièces</b> (moins de 11 salariés, dans les locaux de l'URSSAF ; passage sur place possible, plus automatique depuis 2020). Pas de nouveau contrôle sur un même point et une même période, sauf fraude ou réponses inexactes. Pas de redressement sur un point déjà contrôlé sans observation, si rien n'a changé.</p>`},
{t:"Les sanctions URSSAF",h:`
<ul><li>Paiement dans le mois de la mise en demeure, avec <b>5 %</b> de majoration de retard, puis <b>0,2 %</b> par mois à partir du 1er février suivant.</li>
<li>Non mise en conformité après observations : <b>+10 %</b> au contrôle suivant.</li>
<li>Travail dissimulé : <b>+25 %</b>, porté à <b>40 %</b> (plusieurs personnes, mineur scolarisé, personne vulnérable, bande organisée).</li>
<li>Ni paiement ni contestation : <b>contrainte</b> (LRAR ou commissaire de justice).</li></ul>`},
{t:"Le travail illégal",h:`
<table><tr><th>Infraction</th><th>En clair</th><th>Sanction</th></tr>
<tr><td>Travail dissimulé</td><td>Dissimulation d'activité ou d'emploi salarié</td><td><b>3 ans, 45 000 €</b> + fermeture, redressement ; le salarié peut rembourser le chômage</td></tr>
<tr><td>Marchandage</td><td>Opération à but lucratif qui prive le salarié du droit du travail</td><td>2 ans, 30 000 €</td></tr>
<tr><td>Prêt illicite de main-d'œuvre</td><td>Hors intérim et portage salarial</td><td>2 ans, 30 000 €</td></tr>
<tr><td>Emploi d'étranger sans titre</td><td></td><td>5 ans, 15 000 € par salarié</td></tr>
<tr><td>Cumul irrégulier d'emplois</td><td>Dépasser la durée maximale en cumulant</td><td>Pas de sanction pénale</td></tr></table>`}
],
exam:["<b>Identifier l'organe</b> (inspection ou URSSAF) et ses pouvoirs.","<b>Dérouler la procédure</b> avec ses délais (30 jours, 2 mois).","<b>Chiffrer la sanction</b> encourue."]},

"1f":{t:"Juridictions et prud'hommes",s:"Quel juge, quels délais, quelle procédure",
lead:`<b>En une ligne :</b> 4 contentieux, 4 juges : prud'hommes (contrat), correctionnel (infractions), administratif (décisions de l'administration), pôle social du TJ (Sécurité sociale).`,
sections:[
{t:"Quel juge pour quel litige ?",h:`
<table><tr><th>Contentieux</th><th>Litiges</th><th>Juge</th><th>Recours</th></tr>
<tr><td>Civil</td><td>Exécution ou rupture du contrat : licenciement, heures sup, harcèlement, requalification</td><td><b>Conseil de prud'hommes</b> (paritaire)</td><td>Ch. sociale CA → ch. sociale Cass.</td></tr>
<tr><td>Pénal</td><td>Travail dissimulé, entrave, marchandage, prêt illicite, sécurité</td><td><b>Tribunal correctionnel</b></td><td>Ch. des appels correctionnels → ch. criminelle</td></tr>
<tr><td>Administratif</td><td>Autorisation de licencier un protégé, PSE, activité partielle</td><td><b>Tribunal administratif</b></td><td>CAA → Conseil d'État</td></tr>
<tr><td>Sécurité sociale</td><td>Affiliation, cotisations, prestations, taux d'incapacité</td><td><b>Pôle social du TJ</b></td><td>Ch. sociale CA → <b>2e chambre civile</b></td></tr></table>
<p>Le CPH n'est <b>pas</b> compétent pour les relations collectives (TJ) ni pour un contrat de droit public (TA).</p>
<p><b>Sécurité sociale :</b> depuis le 1er janvier 2019, TASS et TCI supprimés, tout passe au <b>pôle social du TJ</b>. Un <b>recours administratif préalable obligatoire</b> précède tout recours (sauf tarification AT par les Carsat/MSA).</p>`},
{t:"Les délais pour saisir le CPH",h:`
<table><tr><th>Action</th><th>Délai</th></tr>
<tr><td>Cas général (exécution, rupture)</td><td><b>2 ans</b> dès la connaissance des faits</td></tr>
<tr><td>Licenciement économique (PSE non validé), CSP, rupture conventionnelle</td><td><b>12 mois</b></td></tr>
<tr><td>Salaires, heures sup, primes</td><td><b>3 ans</b></td></tr>
<tr><td>Contestation du reçu pour solde de tout compte <b>signé</b></td><td><b>6 mois</b> (3 ans s'il n'est pas signé)</td></tr>
<tr><td>Harcèlement, discrimination</td><td><b>5 ans</b></td></tr>
<tr><td>Dommage corporel</td><td><b>10 ans</b> dès la consolidation</td></tr></table>
<div class="tip">Du plus court au plus long : <b>6 mois – 12 mois – 2 ans – 3 ans – 5 ans – 10 ans</b>.</div>
<p><b>CPH compétent :</b> lieu de l'établissement, de conclusion du contrat ou siège social ; travail à domicile : domicile du salarié.</p>`},
{t:"La procédure",h:`
<ol><li><b>Bureau de conciliation et d'orientation (BCO)</b> : séance non publique, parties entendues éventuellement séparément. Accord = PV de conciliation (total ou partiel). Partie absente non représentée sans motif : le BCO peut juger.</li>
<li>Pas d'accord : le BCO met l'affaire en état, peut ordonner à titre provisoire la remise de documents et des provisions sur salaires et indemnités, et oriente vers le <b>bureau de jugement</b> : restreint (1 + 1 conseillers, 3 mois) ou complet (2 + 2, 6 mois pour l'économique).</li>
<li>Jugement à la <b>majorité absolue</b> ; partage des voix → <b>audience de départage</b> présidée par un juge du TJ.</li>
<li>Exécution au lendemain de l'expiration des recours ; sinon copie exécutoire et commissaire de justice, juge de l'exécution, ou <b>AGS</b> si procédure collective.</li></ol>
<p><b>Directement au bureau de jugement (dans le mois) :</b> prise d'acte, requalification CDD en CDI. Licenciement économique : conciliation dans le mois.</p>
<p><b>Référé (urgence) :</b> mesures provisoires : documents (attestation France Travail, certificat de travail, bulletins), provisions, conservation des preuves.</p>`}
],
exam:["<b>Qualifier le litige</b> (individuel, pénal, administratif, Sécurité sociale).","<b>Désigner le juge</b> et vérifier le délai de prescription.","<b>Décrire la procédure</b> (conciliation, jugement, départage)."]},

"1g":{t:"Sources du droit du travail",s:"Normes, hiérarchie, usages",
lead:`<b>En une ligne :</b> beaucoup de sources, une hiérarchie, et une exception propre au droit social : le principe de faveur, de plus en plus limité.`,
sections:[
{t:"Les sources",h:`
<table><tr><th>Type</th><th>Exemples</th></tr>
<tr><td>Internationales</td><td>Conventions de l'<b>OIT</b> (obligatoires une fois ratifiées), CEDH 1950, Charte sociale européenne 1961, Acte unique 1986, Charte communautaire 1989, Charte des droits fondamentaux de l'UE, négociation européenne, jurisprudence <b>CJUE</b></td></tr>
<tr><td>Nationales non négociées</td><td><b>Bloc de constitutionnalité</b> (Constitution 1958, DDHC 1789, Préambule 1946, Charte de l'environnement 2004), Code civil (droit commun du contrat), Code du travail, Code pénal (droit pénal spécial du travail), Code de la Sécurité sociale, jurisprudence, usages</td></tr>
<tr><td>Nationales négociées</td><td>Conventions et accords collectifs (interprofessionnel, branche, groupe, entreprise, établissement), contrat de travail</td></tr>
<tr><td>Normes de l'employeur</td><td>Règlement intérieur, usages, engagements unilatéraux</td></tr></table>
<p><b>Jurisprudence :</b> CPH, TJ (représentants), chambres sociales de la cour d'appel et de la Cour de cassation.</p>`},
{t:"Les usages d'entreprise",h:`
<p>Pratique de l'employeur qui accorde un avantage (prime, congé, pause payée). <b>3 critères</b> :</p>
<table><tr><th>Critère</th><th>Sens</th></tr>
<tr><td>Généralité</td><td>Tous les salariés ou une catégorie</td></tr>
<tr><td>Constance</td><td>Répété dans le temps</td></tr>
<tr><td>Fixité</td><td>Règles de calcul précises, même si le montant varie</td></tr></table>
<p>Le salarié qui l'invoque doit le <b>prouver</b>.</p>
<p><b>Dénonciation</b> (sans motif) : informer le <b>CSE</b> + chaque salarié <b>individuellement</b> (un affichage ne suffit pas) + <b>délai de prévenance suffisant</b>. Sinon l'usage reste en vigueur.</p>`},
{t:"Hiérarchie et principe de faveur",h:`
<p>La norme supérieure prime ; l'inférieure ne peut y déroger. <b>Exception :</b> le <b>principe de faveur</b>, une norme inférieure peut déroger si elle est plus favorable au salarié.</p>
<p>Ce principe recule : un accord d'entreprise peut, dans les cas prévus, déroger à l'accord de branche même en moins favorable.</p>
<p><b>Ordre public social absolu :</b> certaines règles sont impératives, l'accord ne peut ni y déroger ni même prévoir mieux.</p>`}
],
exam:["<b>Lister les normes</b> en présence.","<b>Les hiérarchiser</b>, puis appliquer le principe de faveur ou ses exceptions.","<b>Pour un usage</b> : vérifier les 3 critères et la régularité de la dénonciation."]},

"1h":{t:"Négociation collective",s:"Conventions, accords, validité, articulation",
lead:`<b>En une ligne :</b> un accord d'entreprise est valide s'il est signé par des syndicats à plus de 50 % (ou 30 % + référendum) ; sans DS, des règles spéciales s'appliquent selon l'effectif ; la branche prime dans 13 matières, l'entreprise ailleurs.`,
sections:[
{t:"Convention ou accord ?",h:`
<p><b>Convention collective :</b> traite de l'<b>ensemble</b> des conditions d'emploi, de travail et des garanties sociales. <b>Accord collectif :</b> un ou plusieurs <b>thèmes</b>.</p>
<p>Niveaux : interprofessionnel (ANI), branche, groupe, entreprise, établissement ; national, régional ou départemental.</p>
<p><b>Durée :</b> en général indéterminée ; à durée déterminée, <b>5 ans maximum</b>.</p>
<p><b>ANI valide si :</b> signé par des syndicats ayant <b>au moins 30 %</b> des suffrages et absence d'<b>opposition</b> des syndicats majoritaires dans les <b>15 jours</b>.</p>
<p><b>Négociation de branche :</b> tous les <b>4 ans</b> (salaires, égalité pro, conditions de travail et GPEC, handicap, formation) ; tous les <b>5 ans</b> (classifications, épargne salariale interentreprises).</p>`},
{t:"Quelle convention s'applique ?",h:`
<p>Critère : l'<b>activité principale</b> (code NAF). Plusieurs activités : chiffre d'affaires (commerce) ou effectifs (industrie). Établissements autonomes avec activités distinctes : chacun sa convention.</p>
<table><tr><th>Assujettissement obligatoire</th><th>Facultatif</th></tr>
<tr><td>Employeur membre d'une organisation signataire ; <b>extension</b> (arrêté ministériel, à toutes les entreprises du champ) ; <b>élargissement</b> (à une autre branche ou un territoire dépourvu)</td><td>Application volontaire (vaut usage) ; adhésion notifiée et déposée</td></tr></table>
<p>Extension et élargissement : convention de branche ou accord (inter)professionnel, commission paritaire présidée par le ministère, clauses obligatoires ; arrêté après avis de la Commission nationale de la négociation collective, publié au JO. <b>Pas d'élargissement sans extension préalable.</b> Seuls les accords d'entreprise sont d'application automatique.</p>
<p><b>Information :</b> s'applique à tous les salariés (CDD, CDI, essai), qui ne peuvent y renoncer. Mention sur le bulletin de paie, avis affiché, version à jour sur l'intranet.</p>`},
{t:"Dénonciation et mise en cause",h:`
<table><tr><th></th><th>Dénonciation</th><th>Mise en cause</th></tr>
<tr><td>Origine</td><td><b>Volonté</b> d'un signataire</td><td><b>Événement extérieur</b> : fusion, cession, scission, changement d'activité</td></tr>
<tr><td>Procédure</td><td>Notification aux signataires, dépôt à la DREETS et au greffe du CPH, information du CSE et des salariés ; <b>préavis de 3 mois</b>. Accord à durée déterminée non dénonçable avant terme (sauf clause)</td><td>Constat de l'événement</td></tr>
<tr><td>Survie</td><td colspan="2">Préavis (3 mois) + jusqu'à <b>12 mois</b>. Négociation d'un accord de substitution (dans les 3 mois si dénonciation par tous les signataires d'un côté)</td></tr>
<tr><td>Sans substitution</td><td colspan="2">Maintien d'une <b>rémunération</b> au moins égale à celle des 12 derniers mois (et non plus les avantages acquis)</td></tr></table>
<p>Dénonciation partielle (un signataire parmi d'autres) : l'accord continue entre les autres. Procédure irrégulière : inopposable aux salariés.</p>`},
{t:"Valider un accord d'entreprise",h:`
<p><b>Avec DS :</b> signature de l'employeur + syndicats représentatifs ayant <b>plus de 50 %</b> des suffrages exprimés en faveur des représentatifs au 1er tour.</p>
<p>Sinon, signataires à <b>plus de 30 %</b> : ils ont <b>1 mois</b> pour demander un <b>référendum</b> ; puis l'employeur peut le demander ; après <b>8 jours</b> sans atteindre 50 %, consultation dans les <b>2 mois</b>. Accord valide s'il est approuvé à la majorité des suffrages exprimés, sinon <b>réputé non écrit</b>.</p>
<table><tr><th>Sans DS</th><th>Qui négocie</th><th>Validité</th></tr>
<tr><td>Moins de 11</td><td>L'employeur propose un projet aux salariés (consultation au moins 15 jours après, secrète, pendant le travail, hors sa présence)</td><td>Référendum aux <b>2/3</b> du personnel</td></tr>
<tr><td>11 à 20 sans élu</td><td>Idem</td><td>Référendum aux <b>2/3</b></td></tr>
<tr><td>11 à 49</td><td>Salarié mandaté par un syndicat, ou élu du CSE (mandaté ou non)</td><td>Élus : signataires majoritaires aux élections. Mandaté non élu : référendum à la majorité</td></tr>
<tr><td>50 et +</td><td>1) élu titulaire <b>mandaté</b> ; 2) élu non mandaté (seulement les mesures que la loi subordonne à un accord) ; 3) salarié mandaté si aucun élu ne veut négocier</td><td>1) référendum ; 2) élus majoritaires, transmis à la branche ; 3) référendum</td></tr></table>
<p>Règles : indépendance des négociateurs, élaboration conjointe, concertation avec les salariés, possibilité de consulter les syndicats de branche. Une organisation ne mandate qu'un salarié.</p>`},
{t:"Branche ou entreprise : qui prime ?",h:`
<p><b>Bloc 1 : 13 matières où la branche prime</b> (sauf garanties au moins équivalentes dans l'accord d'entreprise) : salaires minima hiérarchiques, classifications, mutualisation du paritarisme et de la formation, garanties collectives complémentaires, durée du travail et aménagement des horaires, CDD et intérim, CDI de chantier, égalité femmes-hommes, renouvellement de la période d'essai, transfert des contrats hors L.1224-1, mise à disposition d'intérimaires, portage salarial.</p>
<p><b>Ailleurs, l'accord d'entreprise prime</b>, qu'il soit antérieur ou postérieur ; à défaut d'accord d'entreprise, la branche s'applique.</p>
<p><b>Entre accords de niveaux supérieurs :</b> une branche peut être moins favorable qu'un accord interprofessionnel, sauf si celui-ci l'interdit expressément.</p>
<div class="trap">Retiens la logique, pas la liste par cœur : la branche garde ce qui assure une concurrence loyale (salaires minima, classifications, contrats précaires, égalité).</div>`},
{t:"Les négociations obligatoires",h:`
<p>Dans les entreprises avec une section syndicale représentative. Un accord de méthode (4 ans max) peut fixer thèmes, périodicité, calendrier, informations, suivi, avec au moins tous les 4 ans les thèmes obligatoires.</p>
<p><b>À défaut d'accord :</b></p>
<ul><li><b>Chaque année :</b> rémunération, temps de travail, partage de la valeur ajoutée ;</li>
<li><b>Chaque année :</b> égalité professionnelle et qualité de vie au travail ;</li>
<li><b>Tous les 3 ans</b> (300 salariés et +) : gestion des emplois et des parcours professionnels.</li></ul>
<p>Sans initiative de l'employeur depuis 12 mois (36 pour la triennale), un syndicat peut l'exiger : transmission aux autres sous 8 jours, convocation sous 15 jours. Crédit d'heures de préparation : 12 h/an (500 salariés), 18 h/an (1 000).</p>
<p><b>Sanction :</b> pénalité plafonnée à <b>10 %</b> des exonérations de cotisations (100 % en cas de récidive dans les 6 ans).</p>
<div class="tip">Obligation de <b>négocier</b>, pas de <b>conclure</b> : en cas d'échec, PV de désaccord transmis à la DREETS.</div>`}
],
exam:["<b>Identifier qui a négocié</b> (DS, élu, mandaté) et l'effectif.","<b>Vérifier la condition de validité</b> correspondante (50 %, 30 % + référendum, 2/3).","<b>Articuler</b> l'accord avec la branche (13 matières) et la loi."]}
});

QCM.push(
["1a","Quels sont les critères cumulatifs du contrat de travail ?",["Prestation, rémunération, lien de subordination","Prestation, durée, écrit","Rémunération, écrit, période d'essai","Subordination, exclusivité, ancienneté"],0,"Les 3 critères jurisprudentiels sont cumulatifs : prestation, rémunération, subordination."],
["1a","Le lien de subordination se caractérise par le pouvoir de…",["fixer le salaire et la durée","donner des ordres, contrôler leur exécution et sanctionner","signer le contrat","embaucher et licencier seulement"],1,"Ordonner, contrôler, sanctionner : c'est le cœur de la subordination."],
["1a","Pour qualifier un contrat de travail, le juge se fonde sur…",["le nom donné au contrat","la volonté exprimée par les parties","les conditions de fait de l'activité","le statut déclaré à l'URSSAF"],2,"Ni la volonté ni la dénomination ne comptent : seules les conditions de fait."],
["1a","Un artisan immatriculé au registre des entreprises est…",["toujours salarié de son client","présumé non salarié, sauf preuve d'une subordination permanente","forcément indépendant, sans preuve contraire possible","assimilé salarié"],1,"Présomption simple de non-salariat : elle tombe si on prouve une subordination juridique permanente."],
["1a","Le contrat par lequel une personne exécute un travail de façon indépendante contre rémunération est…",["un contrat de mandat","un contrat de société","un contrat d'entreprise","un contrat de travail"],2,"Contrat d'entreprise : travail indépendant pour un client (maître de l'ouvrage)."],
["1a","Le contrat de mandat a pour objet…",["l'exécution d'un travail matériel","l'accomplissement d'actes juridiques pour le compte du mandant","la mise en commun d'apports","un travail bénévole"],1,"Le mandataire accomplit des actes juridiques pour le mandant."],
["1a","Si le juge requalifie une prestation de services en contrat de travail, l'entreprise doit notamment…",["rien, le contrat initial reste valable","des rappels de salaires et de cotisations","seulement une amende","seulement changer le nom du contrat"],1,"Conséquences : rappels de salaires, cotisations sociales, indemnités de rupture."],
["1b","Quels sont les 3 principes fondateurs de la protection sociale ?",["Unité, universalité, uniformité","Solidarité, égalité, liberté","Répartition, capitalisation, mutualité","Assujettissement, affiliation, immatriculation"],0,"Unité, universalité, uniformité."],
["1b","L'attribution du numéro de sécurité sociale s'appelle…",["l'assujettissement","l'affiliation","l'immatriculation","la liquidation"],2,"Immatriculation = attribution du numéro (13 chiffres + clé)."],
